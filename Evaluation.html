<script>
(()=>{
'use strict';
const ROLE_DEFS = [{"id":"01","name":"SLT Member","sourceFile":"01_SLT_Member_Responsibilities_Discussion_List.docx","purpose":"Provide school-wide strategic and operational leadership within delegated portfolios, while contributing collectively to whole-school leadership.","oversight":"Principal / Tumuaki, with governance oversight retained by the School Board.","worksWith":"Other SLT members, Pou Taahuu / Faculty Leaders, Pou Tuarongo / year leaders, professional and support staff.","escalation":"Principal for matters outside delegation, major risk, significant staffing matters, serious complaints or strategic decisions.","boundary":"An SLT member should not absorb routine middle-leadership work that properly belongs with faculty, department or pastoral leaders.","sections":[{"number":1,"title":"Strategic Leadership","items":["Translate school strategy and priorities into clear actions within the delegated portfolio.","Make decisions within delegated authority and communicate the reasoning clearly.","Identify emerging risks, opportunities and cross-school implications.","Bring coherent recommendations to the Principal rather than only reporting problems.","Support consistency between strategic intent and day-to-day practice."]},{"number":2,"title":"Line Management and Leadership of Leaders","items":["Set clear expectations for the leaders and staff directly line-managed.","Hold regular purposeful check-ins focused on priorities, people, risk and outcomes.","Develop middle leaders rather than routinely doing their work for them.","Address significant performance or conduct concerns through the correct employment process and delegated authority.","Ensure leaders understand what they own, what requires consultation and what must be escalated."]},{"number":3,"title":"Teaching, Learning and Curriculum Oversight","items":["Maintain oversight of the quality and coherence of teaching and learning within the delegated portfolio.","Support curriculum leaders to respond to curriculum, qualification and assessment changes.","Monitor significant achievement patterns and equity concerns.","Challenge weak systems while allowing leaders reasonable professional autonomy.","Coordinate school-wide decisions where consistency across faculties is required."]},{"number":4,"title":"Pastoral, Student and Safeguarding Oversight","items":["Ensure pastoral and behaviour systems within the portfolio are understood and consistently implemented.","Support year-level leaders with serious, complex or repeated student matters.","Ensure safeguarding, wellbeing and serious safety concerns are escalated and managed under school procedures.","Maintain an appropriate distinction between leadership oversight and specialist counselling, clinical or statutory functions."]},{"number":5,"title":"People, Culture and Communication","items":["Model respectful, calm and professional leadership.","Communicate decisions in time for leaders and staff to act on them.","Invite challenge and relevant information before finalising significant decisions.","Address role confusion, workload risks and duplicated systems early.","Recognise and build leadership capability across the school."]},{"number":6,"title":"Health, Safety and Organisational Risk","items":["Maintain oversight of significant health and safety risks within delegated portfolios.","Ensure hazards and incidents are responded to at the right level and that corrective actions are followed through.","Escalate serious or systemic risk to the Principal immediately.","Check that assurance is based on evidence that systems are operating, not only on policies existing."]},{"number":7,"title":"Resources, Budget and Major Decisions","items":["Work within delegated financial authority.","Ensure major spending decisions align with strategic priorities and approved budgets.","Require middle leaders to plan and prioritise before escalating resource requests.","Coordinate decisions that affect more than one faculty or operational area.","Keep the Principal informed about material budget, property, staffing or operational risks."]},{"number":8,"title":"Policy, Compliance and Documentation","items":["Ensure delegated school policies and procedures are implemented and reviewed as required.","Maintain appropriate records of significant decisions, complaints, staffing matters and risks.","Protect privacy and use information only for legitimate school purposes.","Ensure important systems do not depend on one person holding undocumented knowledge."]},{"number":9,"title":"Community and Whaanau","items":["Support leaders with significant or escalated whaanau concerns.","Manage serious complaints within delegated authority and refer matters appropriately.","Represent the school professionally in community and external relationships.","Support positive communication, not only communication when problems arise."]},{"number":10,"title":"Annual Planning and Review","items":["Review outcomes within the portfolio and identify priorities for the following year.","Identify staffing, capability, budget, property and system needs early.","Recommend changes to the Principal with evidence, options and implications.","Confirm responsibilities and delegated authorities for the next cycle."]}]},{"id":"02","name":"Pou Taahuu / Faculty Leader","sourceFile":"02_Pou Taahuu_Head_of_Faculty_Responsibilities_Discussion_List.docx","purpose":"Lead the whole faculty, develop HODs, create cross-department consistency and provide assurance to SLT.","oversight":"Allocated SLT line leader.","worksWith":"HODs, subject leaders, teachers, technicians/support staff, pastoral leaders and relevant school-wide portfolio holders.","escalation":"SLT for major staffing, serious complaints, significant risk, major capital decisions or issues that cannot be resolved at faculty level.","boundary":"The Pou Taahuu should hold HODs accountable for day-to-day department leadership rather than becoming the default HOD for every department.","sections":[{"number":1,"title":"Leadership of the Faculty","items":["Set clear faculty direction consistent with school priorities.","Lead and develop HODs and other faculty leaders.","Create clarity about what belongs at teacher, HOD, Pou Taahuu and SLT level.","Coordinate issues that cross departments.","Represent faculty needs and risks to SLT."]},{"number":2,"title":"Curriculum and Programme Coherence","items":["Maintain strategic oversight of curriculum across the faculty.","Ensure departments respond to curriculum and qualification changes.","Check progression, pathways and course coherence across departments.","Challenge unnecessary duplication or gaps between departments.","Approve or recommend significant curriculum changes through the correct school process."]},{"number":3,"title":"Teaching and Learning","items":["Promote high-quality teaching across the faculty.","Use evidence, observation and professional dialogue to identify faculty-wide strengths and needs.","Support HODs to improve teaching without taking over routine teacher support.","Coordinate faculty PLD where common needs exist.","Monitor whether agreed teaching approaches are having the intended effect."]},{"number":4,"title":"People and HOD Development","items":["Hold regular leadership conversations with HODs.","Support HODs to solve day-to-day problems independently.","Address significant staff performance or conduct concerns at the appropriate level.","Identify workload, capability and succession risks.","Delegate appropriately and follow up agreed actions."]},{"number":5,"title":"Assessment and NZQA Assurance","items":["Maintain faculty-level oversight of assessment and moderation systems.","Ensure HODs are managing current standards, timelines and moderation within departments.","Identify cross-department assessment risks and inconsistencies.","Escalate significant NZQA or consent-to-assess concerns through the Principal’s Nominee / SLT as appropriate."]},{"number":6,"title":"Student Achievement and Pathways","items":["Monitor faculty-wide achievement and participation patterns.","Identify significant inequities or areas of under-performance.","Require departments to respond to students at risk and evaluate interventions.","Maintain oversight of pathways across the faculty and links to careers, tertiary and industry."]},{"number":7,"title":"Health and Safety Assurance","items":["Maintain faculty-wide assurance that specialist health and safety systems are operating.","Require HODs to implement safe systems within their departments.","Respond promptly to significant hazards, incidents and repeated non-compliance.","Coordinate faculty-level actions, training and resource priorities.","Escalate serious or systemic risks to SLT."]},{"number":8,"title":"Budget, Equipment and Resources","items":["Allocate and monitor faculty budgets in line with school delegations.","Balance priorities between departments.","Review major equipment and capital requests before escalation.","Plan replacement cycles and significant future costs.","Ensure technicians/support staff workloads and resources are workable."]},{"number":9,"title":"Complaints, Behaviour and Whaanau","items":["Support HODs with significant classroom or department issues.","Handle matters escalated beyond HOD level within delegation.","Coordinate with Pou Tuarongo / pastoral leaders when issues are primarily pastoral.","Keep SLT informed about serious or unresolved complaints."]},{"number":10,"title":"Planning and Reporting","items":["Review faculty performance, staffing, curriculum, H&S and resource needs.","Report significant outcomes, risks and recommendations to SLT.","Ensure department plans are ready for the following year.","Maintain continuity of key faculty systems and documentation."]}]},{"id":"03","name":"Head of Department","sourceFile":"03_Head_of_Department_Responsibilities_Discussion_List.docx","purpose":"Lead the day-to-day operation, curriculum, staff support, assessment, resources and improvement of the department.","oversight":"Pou Taahuu / Faculty Leader.","worksWith":"Department teachers, subject leaders, technicians/support staff, pastoral leaders, Principal’s Nominee and relevant school-wide leaders.","escalation":"Pou Taahuu for significant staffing, unresolved complaints, major resource decisions, systemic H&S risk or matters beyond department authority.","boundary":"The HOD leads the department; the Pou Taahuu retains faculty-wide direction, cross-department consistency and major leadership/employment oversight.","sections":[{"number":1,"title":"Leadership of the Department","items":["Provide day-to-day leadership of the subject area.","Set clear expectations for staff within the department.","Communicate faculty and school expectations to department staff.","Keep the Pou Taahuu informed about significant issues.","Bring possible solutions to the Pou Taahuu rather than only identifying problems.","Lead department discussion and decision-making.","Follow through on agreed actions."]},{"number":2,"title":"Curriculum","items":["Lead curriculum planning within the subject area.","Ensure programmes meet current curriculum requirements.","Maintain clear progression from junior to senior courses.","Review programmes of learning regularly.","Coordinate common programmes where multiple teachers teach the same course.","Identify curriculum gaps or unnecessary repetition.","Recommend significant curriculum changes to the Pou Taahuu."]},{"number":3,"title":"Teaching and Learning","items":["Promote high-quality teaching within the department.","Discuss teaching practice regularly with staff.","Share effective strategies and resources.","Support staff who are having difficulty with a class or programme.","Monitor whether programmes are working for students.","Encourage consistency without expecting every teacher to teach identically.","Identify professional learning needs and model good practice."]},{"number":4,"title":"Department Staff","items":["Support and induct teachers within the department.","Check that staff understand department systems and key deadlines.","Regularly check in with staff and identify workload concerns early.","Address minor professional issues appropriately.","Raise significant performance or conduct concerns with the Pou Taahuu.","Delegate appropriate responsibilities rather than doing everything personally."]},{"number":5,"title":"Assessment and NZQA","items":["Coordinate senior assessment within the department.","Ensure current standards and assessment materials are used.","Ensure information given to students is accurate.","Maintain assessment timelines and internal moderation processes.","Keep required moderation evidence and respond to external moderation feedback.","Monitor consistency of assessment decisions.","Raise significant assessment concerns with the Pou Taahuu and/or Principal’s Nominee."]},{"number":6,"title":"Student Achievement","items":["Monitor achievement within department courses.","Know which students are at risk of not achieving.","Identify patterns and equity concerns in achievement data.","Discuss concerns with teachers and agree strategies.","Monitor whether interventions are working.","Report significant concerns or successes to the Pou Taahuu."]},{"number":7,"title":"Health and Safety","items":["Ensure staff follow faculty and school H&S procedures.","Ensure students receive appropriate safety instruction and demonstrate required competency before specialist equipment use.","Monitor safe use of specialist spaces and required PPE.","Ensure hazards, equipment faults, accidents, incidents and near misses are reported.","Remove unsafe equipment from use and coordinate repair/maintenance.","Ensure staff understand emergency procedures.","Raise significant H&S concerns with the Pou Taahuu immediately."]},{"number":8,"title":"Equipment, Resources and Budget","items":["Maintain oversight of department equipment and resources.","Identify repair, replacement and consumable needs.","Prioritise purchases and monitor spending.","Coordinate maintenance with the Pou Taahuu, technicians and property staff as appropriate.","Plan ahead for major replacement costs.","Keep appropriate purchasing records and stay within agreed delegation."]},{"number":9,"title":"Beginning Teachers / PCT Support","items":["Provide or arrange curriculum-specific advice, guidance and support for eligible beginning teachers.","Protect the distinction between curriculum-specific HOD support and school-wide mentoring/induction.","Meet regularly enough to support planning, assessment, behaviour and subject-specific pedagogy.","Ensure concerns are identified early and the PCT knows who to seek help from.","Where HOD beginning-teacher support is formally delegated, ensure the receiving teacher is suitably qualified and the support remains equivalent."]},{"number":10,"title":"Technicians / Support Staff","items":["Communicate clearly and plan work ahead.","Prioritise support-staff workload and make clear what is and is not their responsibility.","Support safe systems of work and raise resource/workload issues with the Pou Taahuu.","Maintain respectful professional relationships between teaching and support staff."]},{"number":11,"title":"Student Behaviour and Whaanau","items":["Support teachers with repeated or more serious department issues.","Ensure unsafe practical-space behaviour is addressed immediately.","Keep appropriate records and work with pastoral leaders when necessary.","Support teachers with parent communication and handle concerns escalated beyond classroom-teacher level.","Refer serious or unresolved matters to the Pou Taahuu."]},{"number":12,"title":"Documentation and Planning","items":["Keep programmes, shared resources, assessment/moderation and H&S documentation current.","Ensure important information is accessible to staff and not held by only one person.","Review courses, achievement, staffing, equipment and H&S needs for the following year.","Have programmes and resources ready for the start of the following year."]}]},{"id":"04","name":"Pou Tuarongo / Dean","sourceFile":"04_Head_of_Year_Kaitiaki_Aakonga_Responsibilities_Discussion_List.docx","purpose":"Lead pastoral care, attendance, behaviour escalation and year-level coordination for a defined cohort of aakonga.","oversight":"SLT member responsible for pastoral care / student support.","worksWith":"Kaiaawhina, classroom teachers, HODs, Pou Taahuu, guidance/wellbeing staff, attendance staff, learning support, whaanau and external agencies as appropriate.","escalation":"Pastoral SLT for serious safeguarding, high-risk wellbeing, major behaviour, legal/statutory matters, serious complaints or suspension/exclusion-level decisions.","boundary":"The Pou Tuarongo / Dean coordinates and leads pastoral support; they are not the default classroom behaviour manager, counsellor, clinician or investigator for every issue.","sections":[{"number":1,"title":"Pastoral and Year-Level Leadership","items":["Set clear year-level expectations and routines.","Provide timely communication to Kaiaawhina and relevant teachers.","Coordinate year-level meetings, assemblies and key events.","Build a consistent, inclusive year-level culture.","Keep SLT informed about significant patterns and risks."]},{"number":2,"title":"Attendance and Engagement","items":["Monitor attendance patterns and identify concerns early.","Coordinate follow-up when classroom/form-level actions have not resolved attendance concerns.","Work with whaanau and attendance staff using school procedures.","Record significant actions and referrals.","Escalate persistent or high-risk non-attendance appropriately."]},{"number":3,"title":"Behaviour and Restorative Practice","items":["Receive repeated or significant behaviour issues after appropriate classroom/department responses.","Support consistent use of the school behaviour framework.","Coordinate responses where issues span multiple subjects.","Use restorative and relationship-based approaches where appropriate.","Escalate serious incidents through SLT procedures."]},{"number":4,"title":"Wellbeing and Safeguarding","items":["Recognise when a concern requires specialist wellbeing, safeguarding or statutory support.","Make referrals through the correct school pathway.","Share information on a need-to-know basis and protect privacy.","Ensure urgent safety concerns are not left waiting for a routine meeting.","Follow up that referred concerns have reached the right person/system."]},{"number":5,"title":"Kaiaawhina / Homeroom Support","items":["Set clear expectations for year-level homeroom routines.","Support Kaiaawhina with attendance, student connection and communication.","Provide information needed for assemblies, year-level notices and transitions.","Avoid passing specialist case-management responsibilities to Kaiaawhina.","Use Kaiaawhina observations as an early-warning source while respecting confidentiality."]},{"number":6,"title":"Academic and Pastoral Coordination","items":["Monitor students whose pastoral circumstances are affecting learning.","Coordinate with HODs/Pou Taahuu when concerns span several subjects.","Support sensible plans for students with significant barriers to engagement.","Avoid taking over subject-specific teaching or assessment decisions.","Identify patterns that require a school-wide response."]},{"number":7,"title":"Whaanau Communication","items":["Support teachers and Kaiaawhina with significant pastoral communication.","Lead communication for complex year-level pastoral matters within delegation.","Keep communication factual, respectful and timely.","Escalate serious or unresolved complaints to SLT.","Promote positive contact with whaanau, not only problem-focused contact."]},{"number":8,"title":"Records, Privacy and Handover","items":["Maintain accurate records of significant pastoral actions and decisions.","Use KAMAR/approved systems consistently.","Ensure sensitive information is shared only with those who need it for legitimate school purposes.","Provide clear handover between year levels or staff when responsibility changes."]},{"number":9,"title":"Safety, Duty and Emergency Responsibilities","items":["Know the year-level role in evacuation, lockdown and emergency procedures.","Support accurate accounting for students during emergency processes.","Respond immediately to serious threats to student or staff safety and involve SLT/emergency services as procedures require."]},{"number":10,"title":"Transitions and Annual Planning","items":["Prepare students and whaanau for year transitions, subject choices and key milestones.","Review year-level trends and identify priorities for the following year.","Identify students who need planned transition support.","Provide clear handover information to the next year-level leader."]}]},{"id":"05","name":"Subject Leader / TIC","sourceFile":"05_Subject_Leader_TIC_Responsibilities_Discussion_List.docx","purpose":"Coordinate a defined subject/course area and provide practical curriculum leadership under the HOD’s department-wide direction.","oversight":"Head of Department.","worksWith":"Teachers of the subject/course, HOD, technicians/support staff, assessment leaders and relevant pathway partners.","escalation":"HOD for staffing, major curriculum changes, significant assessment concerns, unresolved student/parent issues, budget decisions or H&S risk.","boundary":"The Subject Leader coordinates the defined subject/course; department-wide staffing, performance management, budget ownership and strategic decisions remain with the HOD unless formally delegated.","sections":[{"number":1,"title":"Subject / Course Coordination","items":["Maintain a clear shared plan for the subject or course.","Ensure teachers know key content, timing and common expectations.","Coordinate common resources where useful.","Identify gaps, repetition or sequencing issues and bring recommendations to the HOD.","Keep the HOD informed about significant issues."]},{"number":2,"title":"Teaching and Learning","items":["Share practical subject-specific strategies and resources.","Support consistency of core learning expectations while allowing professional judgement.","Identify areas where teachers need additional subject knowledge or support.","Model effective subject practice.","Use student work and outcomes to review programme effectiveness."]},{"number":3,"title":"Assessment and Moderation","items":["Coordinate assessment tasks and timelines for the subject/course.","Ensure current assessment materials and conditions are used.","Coordinate internal moderation and retain required evidence.","Identify inconsistent assessment decisions and resolve them with the HOD where necessary.","Raise significant NZQA issues promptly."]},{"number":4,"title":"Resources and Specialist Spaces","items":["Maintain oversight of resources specifically allocated to the subject/course.","Plan consumables and preparation needs in good time.","Report equipment faults and replacement needs.","Coordinate technician support through agreed department systems.","Avoid committing department funds without delegated authority."]},{"number":5,"title":"Health and Safety","items":["Apply department H&S systems consistently within the subject/course.","Ensure teachers/students receive subject-specific safety guidance where required.","Raise hazards, unsafe equipment or unsafe programme design with the HOD immediately.","Do not create local workarounds that undermine department safety procedures."]},{"number":6,"title":"Student Achievement and Support","items":["Monitor achievement patterns within the subject/course.","Identify students or groups needing additional support.","Coordinate subject-specific interventions with teachers.","Escalate wider pastoral patterns through the HOD/Pou Tuarongo / Dean as appropriate."]},{"number":7,"title":"Communication and Documentation","items":["Keep shared subject/course documentation current.","Record important decisions and agreed changes.","Ensure resources and key information are accessible to all teachers of the course.","Communicate deadlines and changes early enough for staff to act."]},{"number":8,"title":"Planning for the Following Year","items":["Review the course and recommend changes.","Identify resource, assessment and pathway needs.","Prepare shared plans/resources for the start of the year.","Bring significant changes to the HOD for approval."]}]},{"id":"06","name":"Full-Time Teacher","sourceFile":"06_Full_Time_Teacher_Responsibilities_Discussion_List.docx","purpose":"Plan, teach, assess and manage safe, inclusive learning for assigned classes while contributing professionally to department and school systems.","oversight":"HOD / curriculum leader for teaching and curriculum; relevant pastoral leader for escalated pastoral matters; professional leader for school-wide professional expectations.","worksWith":"Students, whaanau, HOD/subject leaders, pastoral leaders, learning support, technicians/support staff and colleagues.","escalation":"HOD for curriculum/class/assessment issues; Pou Tuarongo / Dean for cross-subject pastoral matters; Pou Taahuu/SLT for serious or unresolved matters through normal pathways.","boundary":"The teacher owns their classroom and routine professional responsibilities; middle leaders should support and escalate appropriately rather than routinely taking over normal classroom work.","sections":[{"number":1,"title":"Planning and Teaching","items":["Plan lessons and programmes aligned with department/school expectations.","Know the learning purpose and communicate expectations clearly.","Use suitable teaching strategies for the learners in the class.","Adapt teaching using evidence of student understanding and progress.","Prepare required resources and specialist spaces in time."]},{"number":2,"title":"Classroom Culture and Relationships","items":["Establish calm, respectful and inclusive classroom routines.","Build relationships that support learning and belonging.","Use the school behaviour framework consistently.","Address routine low-level behaviour in the classroom.","Seek support when behaviour becomes repeated, serious or unsafe."]},{"number":3,"title":"Assessment and Feedback","items":["Use agreed assessment conditions, tasks and timelines.","Provide accurate, useful feedback and feed-forward.","Make assessment decisions consistently and participate in moderation.","Keep assessment records accurate and secure.","Raise concerns about assessment validity or workload with the HOD early."]},{"number":4,"title":"Student Achievement and Inclusion","items":["Know which students are making expected progress and who needs additional support.","Use available learning-support information appropriately.","Provide reasonable classroom adjustments and follow agreed plans.","Communicate concerns early rather than waiting until reporting time.","Celebrate student progress and success."]},{"number":5,"title":"Health and Safety","items":["Follow school and department health and safety procedures and instructions.","Give students the safety instruction and supervision required for the activity being taught.","Use only equipment and spaces for which the teacher is competent and authorised.","Stop or modify an activity when conditions are unsafe, and report hazards, faults, incidents and near misses promptly.","Use required PPE and ensure students do the same in specialist environments."]},{"number":6,"title":"Whaanau Communication","items":["Communicate professionally and respectfully with whaanau about learning and routine concerns.","Keep factual records of significant communication.","Involve the HOD or pastoral leader when a concern becomes repeated, serious or cross-subject.","Refer serious complaints through the correct leadership pathway."]},{"number":7,"title":"Department Contribution","items":["Attend and contribute to required department/faculty meetings.","Share resources and information rather than creating avoidable single-person systems.","Meet agreed deadlines.","Contribute to moderation, curriculum review and common planning.","Raise practical problems with possible solutions."]},{"number":8,"title":"Professional Responsibilities","items":["Maintain a current practising certificate and engage in required professional growth/learning processes.","Follow the Code/Standards and school professional expectations.","Protect student privacy and confidential information.","Complete required administrative tasks accurately and on time.","Seek professional support when unsure rather than guessing in high-risk situations."]},{"number":9,"title":"School Contribution","items":["Carry out allocated duties and reasonable school responsibilities.","Support school events, emergency procedures and student supervision expectations.","Communicate absences and provide suitable relief work when required.","Contribute to a positive professional staff culture."]}]},{"id":"07","name":"PCT / Beginning Teacher — Year 1","sourceFile":"07_PCT_Beginning_Teacher_Year_1_Responsibilities_Discussion_List.docx","purpose":"Teach assigned classes safely and professionally while participating in a structured induction and mentoring programme and developing increasing independence.","oversight":"HOD / curriculum leader plus designated mentor and the school professional leader responsible for induction/certification.","worksWith":"HOD/subject leaders, mentor, PCT coordinator, pastoral leaders, learning support, technicians/support staff and whaanau.","escalation":"Seek support earlier than an experienced teacher would be expected to when unsure about curriculum, assessment, behaviour, safety, professional judgement or school systems.","boundary":"A Year 1 teacher is responsible for their classes and professional conduct, but is meeting the Standards with support and should not be left to invent school, curriculum or assessment systems alone.","sections":[{"number":1,"title":"Getting Established","items":["Learn the school, department and year-level systems that affect assigned classes.","Know who to contact for curriculum, pastoral, H&S, assessment and professional support.","Use mentor/HOD meetings to ask questions early.","Keep key deadlines, routines and procedures visible and manageable."]},{"number":2,"title":"Planning and Teaching","items":["Plan lessons with clear learning purposes and suitable sequencing.","Use department programmes and shared resources rather than rebuilding everything from scratch.","Trial strategies, reflect on what happened and discuss adjustments with mentor/HOD.","Develop routines that reduce unnecessary workload and increase consistency."]},{"number":3,"title":"Classroom Relationships and Behaviour","items":["Establish explicit routines and expectations.","Use the school behaviour framework and seek coaching on difficult situations.","Address routine behaviour while escalating serious, repeated or unsafe issues.","Ask for observation/support before a pattern becomes unmanageable."]},{"number":4,"title":"Assessment and Reporting","items":["Learn department assessment and moderation systems before making high-stakes decisions independently.","Use current materials and agreed conditions.","Participate actively in moderation and ask when evidence is borderline or unclear.","Meet reporting deadlines with support where needed."]},{"number":5,"title":"Health and Safety","items":["Follow school and department health and safety procedures and instructions.","Give students the safety instruction and supervision required for the activity being taught.","Use only equipment and spaces for which the teacher is competent and authorised.","Stop or modify an activity when conditions are unsafe, and report hazards, faults, incidents and near misses promptly.","Use required PPE and ensure students do the same in specialist environments.","Ask for direct guidance before using unfamiliar specialist equipment, processes or hazardous substances.","Do not assume prior personal experience is equivalent to school authorisation or competency."]},{"number":6,"title":"Induction and Mentoring","items":["Participate consistently in the school induction and mentoring programme.","Set professional goals with the mentor/professional leader.","Engage in observation, feedback, professional learning and reflection.","Keep the agreed records of learning and development needed for the programme.","Discuss readiness for increased independence rather than simply accumulating paperwork."]},{"number":7,"title":"Working with the HOD","items":["Use curriculum-specific support for planning, subject pedagogy, assessment and department systems.","Bring questions and examples of student work/lesson plans where useful.","Tell the HOD early when workload, behaviour, assessment or programme issues are emerging.","Follow through on agreed actions and report back on what happened."]},{"number":8,"title":"Whaanau and Professional Communication","items":["Use factual, respectful communication and seek support for difficult conversations.","Ask a leader to join or advise when a conversation is likely to be complex or contentious.","Keep appropriate records of significant communication.","Protect privacy and confidentiality."]},{"number":9,"title":"Professional Growth and Certification","items":["Work toward demonstrating the current Teaching Council Standards / Ngā Paerewa through everyday practice and the induction programme.","Use feedback as evidence for growth rather than treating support as a sign of failure.","Know who the professional leader is who will make/endorse the formal certification decision.","Raise any uncertainty about certification progress early."]}]},{"id":"08","name":"PCT / Beginning Teacher — Year 2","sourceFile":"08_PCT_Beginning_Teacher_Year_2_Responsibilities_Discussion_List.docx","purpose":"Consolidate effective classroom practice, demonstrate increasing independence and complete the induction/mentoring work needed for readiness for full certification.","oversight":"HOD / curriculum leader plus designated mentor and school professional leader responsible for induction/certification.","worksWith":"HOD/subject leaders, mentor, PCT coordinator, pastoral leaders, learning support, technicians/support staff and whaanau.","escalation":"Continue to seek support promptly for significant curriculum, behaviour, assessment, safety, professional or workload issues while taking greater ownership of routine decisions.","boundary":"Year 2 is not “unsupported teacher lite”; the teacher should be increasingly independent while still receiving structured advice, guidance and mentoring.","sections":[{"number":1,"title":"Consolidating Classroom Practice","items":["Run predictable classroom routines with increasing confidence.","Plan coherent sequences rather than isolated lessons.","Adapt teaching using evidence of student progress.","Identify recurring problems and trial deliberate improvements.","Seek targeted feedback on specific areas rather than waiting for general observation."]},{"number":2,"title":"Curriculum and Subject Knowledge","items":["Strengthen understanding of curriculum progression and course pathways.","Take greater ownership of adapting shared programmes for actual learners.","Contribute useful resources and ideas to the department.","Identify curriculum questions and bring reasoned options to the HOD."]},{"number":3,"title":"Assessment and Moderation","items":["Make routine assessment decisions with increasing confidence.","Use moderation strategically for difficult or high-stakes judgements.","Understand how assessment decisions affect student pathways and reporting.","Contribute to improving shared assessment materials where appropriate."]},{"number":4,"title":"Behaviour, Relationships and Pastoral Judgement","items":["Manage routine classroom behaviour consistently.","Recognise when an issue is classroom-based, department-based or primarily pastoral.","Use records and communication to show patterns rather than relying on memory.","Escalate serious or cross-subject issues through the correct pathway."]},{"number":5,"title":"Health and Safety","items":["Follow school and department health and safety procedures and instructions.","Give students the safety instruction and supervision required for the activity being taught.","Use only equipment and spaces for which the teacher is competent and authorised.","Stop or modify an activity when conditions are unsafe, and report hazards, faults, incidents and near misses promptly.","Use required PPE and ensure students do the same in specialist environments.","Demonstrate consistent judgement about when to stop, modify or seek advice on practical activities."]},{"number":6,"title":"Induction, Mentoring and Reflection","items":["Continue regular mentoring/induction activity rather than allowing it to disappear as confidence grows.","Use professional goals linked to actual learner outcomes and teaching practice.","Engage with observation, feedback and professional learning.","Maintain the agreed record of progress toward full certification."]},{"number":7,"title":"Increasing Professional Independence","items":["Bring likely solutions as well as problems to the HOD/mentor.","Follow through on agreed actions and evaluate the result.","Take responsibility for routine whaanau communication and class administration.","Ask for support early on unfamiliar or high-risk matters.","Avoid equating independence with working in isolation."]},{"number":8,"title":"Readiness for Full Certification","items":["Discuss progress toward the Standards / Ngā Paerewa explicitly with mentor and professional leader.","Identify any gaps in experience or evidence before the end of the programme.","Complete agreed actions needed before an endorsement decision.","Understand that the professional leader makes an evidence-based judgement about readiness."]},{"number":9,"title":"Contribution to Department and School","items":["Contribute to shared planning, moderation and professional discussion.","Support colleagues through practical sharing without taking on inappropriate leadership load.","Participate reliably in school duties, meetings and events.","Begin identifying possible future areas of professional contribution."]}]},{"id":"09","name":"PCT Mentor","sourceFile":"09_PCT_Mentor_Responsibilities_Discussion_List.docx","purpose":"Provide structured professional mentoring that helps a beginning teacher grow, reflect, meet the Standards and move toward appropriate independence.","oversight":"School professional leader / person responsible for induction and certification processes.","worksWith":"Beginning teacher, HOD/curriculum leader, subject leaders, Specialist Classroom Teacher where relevant and other support staff.","escalation":"Professional leader for certification concerns, serious professional issues, unresolved support needs or matters outside the mentor role.","boundary":"Mentoring is developmental support. It does not replace the HOD’s curriculum-specific responsibility, the employer’s formal competence/conduct processes, or the professional leader’s certification decision.","sections":[{"number":1,"title":"Establishing the Programme","items":["Clarify mentor, HOD, PCT coordinator and professional leader responsibilities at the start.","Agree a regular meeting rhythm and practical communication method.","Help the teacher identify realistic goals based on current practice and learner needs.","Ensure the teacher knows what records are expected and why."]},{"number":2,"title":"Professional Dialogue","items":["Create space for honest discussion without turning every meeting into compliance checking.","Ask questions that help the teacher analyse what students are doing and learning.","Give specific, actionable feedback.","Balance encouragement with appropriate challenge.","Follow up previous actions."]},{"number":3,"title":"Observation and Feedback","items":["Arrange or support useful observations of the beginning teacher.","Help the beginning teacher observe effective practice in others.","Focus observations on agreed questions or goals.","Separate developmental feedback from any formal employment process unless the school has explicitly moved into such a process."]},{"number":4,"title":"Standards and Evidence","items":["Help the teacher understand how current Standards / Ngā Paerewa connect to everyday practice.","Use naturally occurring evidence rather than creating unnecessary paperwork.","Identify gaps in experience or evidence early.","Support the teacher to reflect on impact on learners."]},{"number":5,"title":"Coordination with the HOD","items":["Ensure curriculum-specific issues reach the HOD or delegated curriculum support person.","Avoid duplicating the HOD’s subject-specific support unnecessarily.","Share relevant support information with consent/need-to-know judgement while protecting appropriate confidentiality.","Coordinate support when classroom issues have both pedagogical and pastoral dimensions."]},{"number":6,"title":"Workload and Wellbeing","items":["Check whether workload is allowing the teacher to use advice/guidance time productively.","Help the teacher prioritise and avoid unnecessary reinvention.","Encourage early help-seeking when workload or stress affects safe/effective practice.","Escalate serious wellbeing or safety concerns through school procedures."]},{"number":7,"title":"Concerns and Escalation","items":["Raise recurring professional concerns early and factually.","Do not promise confidentiality that would prevent action on safety, safeguarding or serious professional concerns.","If a concern may become a competence/conduct matter, involve the correct professional leader rather than trying to manage it informally forever.","Keep mentoring notes professional and appropriate."]},{"number":8,"title":"Readiness for Full Certification","items":["Review progress over time with the beginning teacher.","Identify remaining development needs before an endorsement decision is due.","Provide relevant professional evidence/feedback to the person responsible for the final decision.","Do not make promises about certification outcomes beyond your delegated role."]}]},{"id":"10","name":"Kaiaawhina / Homeroom Teacher","sourceFile":"10_Kaiaawhina_Homeroom_Teacher_Responsibilities_Discussion_List.docx","purpose":"Provide a consistent daily point of connection for students, complete required homeroom administration and identify concerns early for referral.","oversight":"Pou Tuarongo / Dean.","worksWith":"Students, whaanau, Pou Tuarongo / Dean, classroom teachers, attendance staff, learning support and wellbeing staff.","escalation":"Pou Tuarongo / Dean for repeated attendance, wellbeing, behaviour or whaanau concerns; urgent safeguarding/safety issues through immediate school procedures.","boundary":"Kaiaawhina are an early connection and referral point; they should not become sole case managers, counsellors or investigators for complex student issues.","sections":[{"number":1,"title":"Daily Connection and Relationships","items":["Know the students in the homeroom group and notice meaningful changes.","Create a calm, respectful and predictable homeroom routine.","Provide key notices and year-level information.","Encourage belonging, participation and positive school connection."]},{"number":2,"title":"Attendance and Rolls","items":["Mark required rolls accurately and on time.","Follow up obvious discrepancies using school procedures.","Notice patterns and refer repeated concerns to the Pou Tuarongo / Dean/attendance system.","Do not independently investigate complex attendance matters beyond the role."]},{"number":3,"title":"Pastoral Check-In","items":["Listen appropriately when students raise concerns.","Distinguish between a routine issue, a referral and an urgent safety concern.","Record/referral information through approved systems.","Follow up that a student has reached the r function paperScaleStripHtml(){return `<div class="paper-scale-strip">${STAGES.map(stage=>`<div class="paper-scale-stage"><b>${stage.value} ${stage.emoji}</b><span>${escapeHtml(stage.label)}</span><small>${escapeHtml(stage.english)} · ${escapeHtml(stage.guide)}</small></div>`).join('')}</div>`}

function paperSectionHtml(role,section,sectionIndex,layout){const chunkSize=layout==='columns-2'?(roleItemCount(role)<=36?2:4):3,chunks=[];for(let start=0;start<section.items.length;start+=chunkSize){const items=section.items.slice(start,start+chunkSize),isFirst=start===0,isFinal=start+items.length>=section.items.length,heading=isFirst?`${section.number}. ${escapeHtml(section.title)}`:`${section.number}. ${escapeHtml(section.title)} — continued`,rows=items.map((item,offset)=>{const itemIndex=start+offset;return `<div class="paper-item"><div class="paper-item-text"><b>${itemIndex+1}.</b>${escapeHtml(item)}</div><div class="paper-score-strip" aria-label="Score choices 1 to 5 or not applicable">${paperScoreBoxesHtml()}</div></div>`}).join(''),finish=isFinal?`<div class="paper-section-result"><span>Total points ______</span><span>÷ scored items ______</span><span>= ______ / 5</span><span>Stage __________________</span></div>${paperSettings.includeNotes?'<div class="paper-note-area"><b>Evidence / notes / agreed action</b><div class="paper-write-rule"></div><div class="paper-write-rule"></div></div>':''}`:'';chunks.push(`<section class="paper-section"><div class="paper-section-head ${isFirst?'':'continued'}"><h3>${heading}</h3><span>${isFirst?`${section.items.length} ${plural(section.items.length,'item')} · circle one score`:'continued'}</span></div><div class="paper-items">${rows}</div>${finish}</section>`)}return chunks.join('')}

function closeStaffModal(){const modal=document.getElementById('staffModal');if(modal.hidden)return;modal.hidden=true;document.body.style.overflow='';editingStaffId=null;modalReturnFocus?.focus?.();modalReturnFocus=null}
function saveStaffFromModal(){const name=document.getElementById('staffName').value.trim(),error=document.getElementById('staffFormError');if(!name){error.textContent='Enter the staff member’s name.';error.hidden=false;document.getElementById('staffName').setAttribute('aria-invalid','true');document.getElementById('staffName').focus();return}const roleId=document.getElementById('staffRole').value,department=document.getElementById('staffDepartment').value.trim();if(editingStaffId){const staff=staffById(editingStaffId);if(!staff)return;const oldRole=staff.roleId;staff.name=safeText(name,100);staff.roleId=hasRole(roleId)?roleId:'06';staff.department=safeText(department,100);if(selectedStaffId===staff.id&&oldRole!==staff.roleId)activeEval=null;toast('Staff record updated')}else{const staff={id:uid('staff'),name:safeText(name,100),roleId:hasRole(roleId)?roleId:'06',department:safeText(department,100),createdAt:new Date().toISOString()};state.staff.push(staff);selectedStaffId=staff.id;activeEval=null;toast('Staff member added')}persist();closeStaffModal();if(selectedStaffId&&!activeEval)ensureActiveEvaluation();renderAll()}
function deleteStaff(id){const staff=staffById(id);if(!staff)return;const count=state.evaluations.filter(e=>e.staffId===id).length;if(!confirm(`Delete ${staff.name} and ${count} saved ${plural(count,'evaluation')} from this browser? Export a backup first if you may need them.`))return;state.staff=state.staff.filter(s=>s.id!==id);state.evaluations=state.evaluations.filter(e=>e.staffId!==id);Object.keys(state.drafts).forEach(key=>{if(key.startsWith(id+'::'))delete state.drafts[key]});if(selectedStaffId===id)selectedStaffId=state.staff[0]?.id||null;activeEval=null;if(selectedStaffId)ensureActiveEvaluation();persist();renderAll();toast('Staff record deleted')}
function deleteEvaluation(id){const evaluation=state.evaluations.find(e=>e.id===id);if(!evaluation||!confirm('Delete this saved evaluation?'))return;state.evaluations=state.evaluations.filter(e=>e.id!==id);const key=draftKey(evaluation.staffId,evaluation.roleId);if(state.drafts[key]?.id===id)delete state.drafts[key];if(activeEval?.id===id)activeEval=null;if(selectedStaffId===evaluation.staffId&&!activeEval)ensureActiveEvaluation();persist();renderStaffList();renderHistory();toast('Evaluation deleted')}
function clearAllData(){if(!confirm('This permanently clears all staff, evaluations and drafts from this browser. Have you exported a backup?'))return;if(!confirm('Confirm again: clear ALL local evaluation data?'))return;state=emptyState();selectedStaffId=null;activeEval=null;persist();renderAll();toast('Local data cleared')}

function download(name,text,type='text/plain;charset=utf-8'){try{const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;link.rel='noopener';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);return true}catch(error){alert('The file could not be downloaded: '+(error?.message||error));return false}}
function exportJSON(){saveDraftNow(false);const payload={...state,schemaVersion:SCHEMA_VERSION,exportedAt:new Date().toISOString(),app:'PHS Staff Progress Evaluation'};if(download(`PHS_staff_evaluation_backup_${today()}.json`,JSON.stringify(payload,null,2),'application/json;charset=utf-8'))toast('Full backup downloaded')}
function csvCell(value){let text=String(value??'');if(/^[\t\r ]*[=+\-@]/.test(text))text="'"+text;return /[",\r\n]/.test(text)?'"'+text.replace(/"/g,'""')+'"':text}
function exportSummaryCSV(){const headers=['Evaluation ID','Date','Staff','Department','Role','Type','Evaluator','Overall average','Overall Arotake rank','Questions scored','Total questions','Sections complete','Total sections','Generated feedback summary','Strongest responsibility sections','Priority responsibility sections','Strongest item evidence','Suggested item actions','Support / authority prompts','Conversation prompt','Strengths / evidence','Next focus','Support / authority needed'],lines=[headers.map(csvCell).join(',')];[...state.evaluations].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{const staff=staffById(e.staffId)||{},role=roleById(e.roleId),stats=evaluationStats(e),rank=stageByMean(stats.mean),feedback=overallFeedbackData(e,role);lines.push([e.id,e.date,staff.name||'',staff.department||'',role.name,e.type||'',e.evaluator||'',stats.mean==null?'':stats.mean.toFixed(2),rank?`${rank.label} ${rank.emoji}`:'',stats.answeredItems,stats.totalItems,stats.completedSections,stats.totalSections,feedback.summary,feedback.sectionStrengths.join(' | '),feedback.sectionPriorities.join(' | '),feedback.strengths.join(' | '),feedback.priorities.join(' | '),feedback.support.join(' | '),feedback.conversation,e.strengths||'',e.nextFocus||'',e.supportNeeded||''].map(csvCell).join(','))});if(download(`PHS_staff_evaluation_summary_${today()}.csv`,'\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8'))toast('Summary CSV downloaded')}
function exportDetailedCSV(){const headers=['Evaluation ID','Date','Staff','Department','Role','Type','Evaluator','Responsibility section','Section average','Section Arotake rank','Responsibility item','Item score','Item Arotake rank','Suggested next step','Section note'],lines=[headers.map(csvCell).join(',')];[...state.evaluations].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{const staff=staffById(e.staffId)||{},role=roleById(e.roleId);role.sections.forEach((section,sectionIndex)=>{const stats=sectionStats(e,role,sectionIndex),rank=stageByMean(stats.mean);section.items.forEach((item,itemIndex)=>{const raw=e.ratings?.[questionKey(role.id,sectionIndex,itemIndex)],itemRank=stageByValue(raw);lines.push([e.id,e.date,staff.name||'',staff.department||'',role.name,e.type||'',e.evaluator||'',`${section.number}. ${section.title}`,stats.mean==null?'':stats.mean.toFixed(2),rank?`${rank.label} ${rank.emoji}`:(stats.complete?'Not applicable':''),item,Number.isInteger(raw)?raw:(raw==='na'?'N/A':''),itemRank?`${itemRank.label} ${itemRank.emoji}`:(raw==='na'?'N/A':''),itemRank?actionForItem(item,itemRank.value):'',e.sectionNotes?.[sectionIndex]||''].map(csvCell).join(','))})})});if(download(`PHS_staff_evaluation_questions_${today()}.csv`,'\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8'))toast('Question detail CSV downloaded')}
function validateBackupFile(file){if(!file)throw new Error('No file selected.');if(file.size>LIMITS.importBytes)throw new Error('The backup is too large for this browser tool.');if(file.type&&file.type!=='application/json'&&!file.name.toLowerCase().endsWith('.json'))throw new Error('Choose a JSON backup file.');}
function importBackup(file){try{validateBackupFile(file)}catch(error){alert(error.message);document.getElementById('importFile').value='';return}const reader=new FileReader();reader.onerror=()=>{alert('The file could not be read.');document.getElementById('importFile').value=''};reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed||typeof parsed!=='object'||!Array.isArray(parsed.staff)||!Array.isArray(parsed.evaluations))throw new Error('Backup structure not recognised.');if(parsed.staff.length>LIMITS.staff||parsed.evaluations.length>LIMITS.evaluations)throw new Error('The backup contains more records than this browser tool safely supports.');if(!confirm(`Restore this backup containing ${parsed.staff.length} staff and ${parsed.evaluations.length} saved ${plural(parsed.evaluations.length,'evaluation')}? This replaces the current browser data.`))return;state=migrateState(parsed);selectedStaffId=state.settings.selectedStaffId||state.staff[0]?.id||null;activeEval=null;if(selectedStaffId)ensureActiveEvaluation();persist();renderAll();toast('Backup restored')}catch(error){alert('Could not import this file: '+(error?.message||error))}finally{document.getElementById('importFile').value=''}};reader.readAsText(file)}
async function copyText(text,downloadName='PHS_feedback.txt'){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);toast('Feedback copied');return}const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();const ok=document.execCommand&&document.execCommand('copy');area.remove();if(ok){toast('Feedback copied');return}throw new Error('Clipboard unavailable')}catch(_error){download(downloadName,text,'text/plain;charset=utf-8');toast('Clipboard unavailable — feedback downloaded instead',3500)}}

function useGeneratedFeedback(){if(!activeEval)return;const role=roleById(activeEval.roleId),data=overallFeedbackData(activeEval,role);if(!data.available){toast('Score some responsibilities first');return}if((activeEval.strengths||activeEval.nextFocus||activeEval.supportNeeded)&&!confirm('Replace the existing reflection text with the generated strengths, next focus and support prompts?'))return;const strengthLines=[...data.sectionStrengths,...data.strengths].slice(0,6),focusLines=[...data.sectionPriorities,...data.priorities,data.conversation?`Conversation prompt: ${data.conversation}`:''].filter(Boolean).slice(0,7);activeEval.strengths=strengthLines.map(x=>'• '+x).join('\n');activeEval.nextFocus=focusLines.map(x=>'• '+x).join('\n');activeEval.supportNeeded=data.support.map(x=>'• '+x).join('\n');saveDraftNow(false);renderEvaluate();const panel=document.getElementById('reflectionPanel');if(panel)panel.open=true;requestAnimationFrame(()=>document.getElementById('strengths')?.focus());toast('Reflection fields filled from scores')}
function clearSection(sectionIndex){if(!activeEval)return;const role=roleById(activeEval.roleId),section=role.sections[sectionIndex];if(!confirm(`Clear all scores in “${section.title}”? The section note will be kept.`))return;section.items.forEach((_,itemIndex)=>delete activeEval.ratings[questionKey(role.id,sectionIndex,itemIndex)]);delete activeEval.sectionRatings[sectionIndex];openSectionIndex=sectionIndex;saveDraftNow(false);renderEvaluate();toast('Section scores cleared')}

function handleActionClick(event){const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;
  if(action==='switch-view'){switchView(button.dataset.view);return}
  if(action==='add-staff'){openStaffModal();return}
  if(action==='cancel-staff'){closeStaffModal();return}
  if(action==='select-staff'){saveDraftNow(false);selectedStaffId=button.dataset.id;const staff=staffById(selectedStaffId),key=staff?draftKey(staff.id,staff.roleId):'';activeEval=key&&state.drafts[key]?cloneData(state.drafts[key]):null;if(staff&&!activeEval)ensureActiveEvaluation();if(activeEval){openSectionIndex=firstIncompleteSection(roleById(activeEval.roleId),activeEval);if(openSectionIndex<0)openSectionIndex=0}persist();renderStaffList();renderEvaluate();return}
  if(action==='edit-current-staff'){openStaffModal(selectedStaffId);return}
  if(action==='edit-staff'){openStaffModal(button.dataset.id);return}
  if(action==='delete-staff'){deleteStaff(button.dataset.id);return}
  if(action==='toggle-section'){const index=Number(button.dataset.section),scrollY=window.scrollY;openSectionIndex=openSectionIndex===index?-1:index;pendingFocus={type:'section',section:index,scrollY};renderEvaluate();return}
  if(action==='score-question'){
    if(!activeEval)return;const key=button.dataset.key,sectionIndex=Number(button.dataset.section),raw=button.dataset.value,value=raw==='na'?'na':Number(raw),scrollY=window.scrollY,role=roleById(activeEval.roleId),wasComplete=sectionStats(activeEval,role,sectionIndex).complete;if(activeEval.ratings[key]===value)delete activeEval.ratings[key];else activeEval.ratings[key]=value;delete activeEval.sectionRatings[sectionIndex];saveDraftNow(false);const stats=sectionStats(activeEval,role,sectionIndex),completedNow=!wasComplete&&stats.complete;
    if(state.settings.autoAdvance!==false&&completedNow){const nextQuestion=firstUnscoredQuestion(role,activeEval,sectionIndex+1);openSectionIndex=nextQuestion?.sectionIndex??-1;pendingFocus=nextQuestion?{type:'question',key:nextQuestion.key,scrollSection:nextQuestion.sectionIndex}:{scrollY};renderEvaluate();const result=stats.mean==null?'Not applicable':scoreStageDisplay(stats.mean);toast(!nextQuestion?`${role.sections[sectionIndex].title}: ${result}. All responsibility items are complete.`:`${role.sections[sectionIndex].title}: ${result}`,4200)}else{openSectionIndex=sectionIndex;pendingFocus={type:'score',key,value:raw,scrollY};renderEvaluate()}return;
  }
  if(action==='next-unscored'){if(!activeEval)return;const role=roleById(activeEval.roleId),start=button.dataset.section==null?Math.max(0,openSectionIndex):Number(button.dataset.section),next=firstUnscoredQuestion(role,activeEval,start);if(!next){toast('All responsibility items are scored or marked N/A');return}openSectionIndex=next.sectionIndex;pendingFocus={type:'question',key:next.key,scrollSection:next.sectionIndex};renderEvaluate();return}
  if(action==='toggle-note'){const index=Number(button.dataset.section),wrap=document.querySelector(`[data-note-wrap="${index}"]`);if(!wrap)return;wrap.classList.toggle('show');if(wrap.classList.contains('show')){pendingFocus={type:'note',section:index};applyPendingFocus()}return}
  if(action==='clear-section'){clearSection(Number(button.dataset.section));return}
  if(action==='copy-section-feedback'){const index=Number(button.dataset.section),role=roleById(activeEval.roleId);copyText(sectionFeedbackText(activeEval,role,index),`PHS_section_feedback_${today()}.txt`);return}
  if(action==='copy-overall-feedback'){copyText(overallFeedbackText(activeEval,staffById(activeEval.staffId),roleById(activeEval.roleId)),`PHS_staff_feedback_${today()}.txt`);return}
  if(action==='fill-reflection'){useGeneratedFeedback();return}
  if(action==='open-paper-current'||action==='paper-use-current'){useCurrentForPaper();return}
  if(action==='print-paper'){preparePaperPrint();return}
  if(action==='new-evaluation'){startNewEvaluation();return}
  if(action==='copy-previous'){copyPrevious();return}
  if(action==='save-draft'){saveDraftNow(true);return}
  if(action==='save-evaluation'){saveEvaluation();return}
  if(action==='print'){prepareEvaluationPrint();return}
  if(action==='open-evaluation'){openEvaluation(button.dataset.id);return}
  if(action==='delete-evaluation'){deleteEvaluation(button.dataset.id);return}
  if(action==='export-json'){exportJSON();return}
  if(action==='import-json'){document.getElementById('importFile').click();return}
  if(action==='export-summary'){exportSummaryCSV();return}
  if(action==='export-detail'){exportDetailedCSV();return}
  if(action==='clear-all'){clearAllData();return}
}
function handleInput(event){const field=event.target.dataset.field;if(event.target.id==='staffSearch'){renderStaffList();return}if(field==='paper-evaluator'){paperSettings.evaluator=safeText(event.target.value,100);schedulePaperPreview();return}if(!activeEval)return;if(field==='evaluator'){activeEval.evaluator=safeText(event.target.value,100);scheduleDraftSave()}else if(field==='section-note'){activeEval.sectionNotes[Number(event.target.dataset.section)]=safeText(event.target.value);scheduleDraftSave()}else if(field==='strengths'){activeEval.strengths=safeText(event.target.value);scheduleDraftSave()}else if(field==='next-focus'){activeEval.nextFocus=safeText(event.target.value);scheduleDraftSave()}else if(field==='support-needed'){activeEval.supportNeeded=safeText(event.target.value);scheduleDraftSave()}}
function handleChange(event){const field=event.target.dataset.field;if(field==='paper-role'){paperSettings.roleId=event.target.value==='all'?'all':(hasRole(event.target.value)?event.target.value:'03');renderPaperPreview();return}else if(field==='paper-staff'){paperSettings.staffId=staffById(event.target.value)?event.target.value:'';const staff=staffById(paperSettings.staffId);if(staff&&paperSettings.roleId!=='all'){paperSettings.roleId=staff.roleId;const roleControl=document.getElementById('paperRole');if(roleControl)roleControl.value=paperSettings.roleId}renderPaperPreview();return}else if(field==='paper-type'){paperSettings.type=event.target.value;renderPaperPreview();return}else if(field==='paper-date'){paperSettings.date=validDate(event.target.value);renderPaperPreview();return}else if(field==='paper-layout'){paperSettings.layout=['auto','one','two'].includes(event.target.value)?event.target.value:'auto';renderPaperPreview();return}else if(field==='paper-overview'){paperSettings.includeOverview=event.target.checked;renderPaperPreview();return}else if(field==='paper-notes'){paperSettings.includeNotes=event.target.checked;renderPaperPreview();return}else if(field==='paper-reflection'){paperSettings.includeReflection=event.target.checked;renderPaperPreview();return}else if(field==='eval-role'){saveDraftNow(false);const staff=staffById(selectedStaffId),roleId=event.target.value,key=draftKey(staff.id,roleId);activeEval=state.drafts[key]?cloneData(state.drafts[key]):null;if(!activeEval)ensureActiveEvaluation(false,roleId);openSectionIndex=firstIncompleteSection(roleById(roleId),activeEval);if(openSectionIndex<0)openSectionIndex=0;renderEvaluate()}else if(field==='eval-type'){activeEval.type=event.target.value;saveDraftNow(false)}else if(field==='date'){activeEval.date=validDate(event.target.value);saveDraftNow(false)}else if(field==='auto-advance'){state.settings.autoAdvance=event.target.checked;persist()}else if(field==='history-staff'){historyFilters.staffId=event.target.value;renderHistoryTable()}else if(field==='history-role'){historyFilters.roleId=event.target.value;renderHistoryTable()}else if(event.target.id==='importFile'&&event.target.files[0])importBackup(event.target.files[0])}
function handleKeydown(event){
  const modal=document.getElementById('staffModal');if(!modal.hidden){if(event.key==='Escape'){event.preventDefault();closeStaffModal();return}if(event.key==='Tab'){const focusable=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled])')].filter(el=>!el.hidden&&el.offsetParent!==null);if(focusable.length){const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}return}}
  const tab=event.target.closest('.tab');if(tab&&(event.key==='ArrowRight'||event.key==='ArrowLeft'||event.key==='Home'||event.key==='End')){event.preventDefault();const tabs=[...document.querySelectorAll('.tab')],index=tabs.indexOf(tab);let next=index;if(event.key==='ArrowRight')next=(index+1)%tabs.length;if(event.key==='ArrowLeft')next=(index-1+tabs.length)%tabs.length;if(event.key==='Home')next=0;if(event.key==='End')next=tabs.length-1;tabs[next].focus();switchView(tabs[next].dataset.view);return}
  const scoreButton=event.target.closest('.q-btn');if(scoreButton){if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();const buttons=[...scoreButton.closest('.question-rating').querySelectorAll('.q-btn')],index=buttons.indexOf(scoreButton),next=event.key==='ArrowRight'?(index+1)%buttons.length:(index-1+buttons.length)%buttons.length;buttons[next].focus();return}const shortcut=/^[1-5]$/.test(event.key)?event.key:(event.key.toLowerCase()==='n'?'na':null);if(shortcut){event.preventDefault();scoreButton.closest('.question-rating').querySelector(`[data-value="${shortcut}"]`)?.click()}}
}

function initialise(){document.addEventListener('click',handleActionClick);document.addEventListener('input',handleInput);document.addEventListener('change',handleChange);document.addEventListener('keydown',handleKeydown);document.getElementById('staffForm').addEventListener('submit',event=>{event.preventDefault();saveStaffFromModal()});document.getElementById('staffModal').addEventListener('mousedown',event=>{if(event.target.id==='staffModal')closeStaffModal()});window.addEventListener('beforeunload',event=>{saveDraftNow(false);if(!storageOK&&hasEvaluationWork(activeEval)){event.preventDefault();event.returnValue=''}});window.addEventListener('beforeprint',()=>{if(!document.body.classList.contains('print-paper')&&!document.body.classList.contains('print-evaluation')){if(activeView==='paperView'){renderPaperPreview();document.body.classList.add('print-paper');activePrintMode='paper'}else{document.body.classList.add('print-evaluation');activePrintMode='evaluation'}}if(!document.body.classList.contains('print-paper'))document.querySelectorAll('#evaluateView details:not(.feedback-more)').forEach(detail=>{detail.dataset.wasOpen=detail.open?'1':'0';detail.open=true})});window.addEventListener('afterprint',()=>{document.querySelectorAll('#evaluateView details').forEach(detail=>{if(detail.dataset.wasOpen!=null){detail.open=detail.dataset.wasOpen==='1';delete detail.dataset.wasOpen}});clearPrintClasses()});
  if(selectedStaffId){ensureActiveEvaluation();openSectionIndex=firstIncompleteSection(roleById(activeEval.roleId),activeEval);if(openSectionIndex<0)openSectionIndex=0}
  document.querySelectorAll('.view').forEach(panel=>panel.hidden=true);switchView(activeView);renderStaffList();updateStorageMeter();if(storageReadError)toast(storageReadError,6500)
}
initialise();
})();
