<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHS Staff Progress Evaluation</title>
<style>
:root{
  --bg:#f4f6f8;--panel:#fff;--ink:#18212a;--muted:#65727e;--line:#d8e0e6;
  --navy:#18354a;--teal:#1f6f78;--teal-soft:#eaf4f4;--amber:#9a671d;--red:#a64141;
  --green:#2f7054;--shadow:0 8px 24px rgba(24,53,74,.08);--radius:14px;
  --seed:#8b5a3c;--grow:#6d7f37;--prosper:#25725c;--flourish:#7b4f87;--leader:#18354a;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;box-shadow:0 3px 16px rgba(0,0,0,.14)}
.topbar-inner{max-width:1450px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:285px}.brand-mark{width:39px;height:39px;border-radius:10px;border:2px solid rgba(255,255,255,.78);display:grid;place-items:center;font-weight:850}.brand h1{font-size:18px;margin:0;line-height:1.15}.brand small{display:block;opacity:.76;font-weight:400;margin-top:2px}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}.tab{border:0;background:rgba(255,255,255,.1);color:#fff;padding:8px 11px;border-radius:8px;font-weight:700}.tab.active,.tab:hover{background:#fff;color:var(--navy)}
.shell{max-width:1450px;margin:auto;padding:18px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px}.main{min-width:0}.view{display:none}.view.active{display:block}
.sidebar,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.sidebar{padding:14px;align-self:start;position:sticky;top:82px;max-height:calc(100vh - 100px);overflow:auto}.panel{padding:18px}.panel+.panel{margin-top:15px}
.side-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.side-head h2{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0}.icon-btn,.small-btn,.primary,.secondary,.danger{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink);font-weight:700}.icon-btn{width:34px;height:34px;padding:0;font-size:20px}.primary{background:var(--teal);border-color:var(--teal);color:#fff}.secondary:hover,.small-btn:hover,.icon-btn:hover{background:#f1f4f6}.danger{color:var(--red);border-color:#e7c7c7}.danger:hover{background:#fff4f4}
.staff-search{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin:2px 0 9px;background:#fbfcfd}.staff-list{display:grid;gap:7px}.staff-item{border:1px solid transparent;border-radius:10px;padding:9px 10px;background:#f8fafb;cursor:pointer}.staff-item:hover{border-color:#b9c8d1}.staff-item.active{background:var(--teal-soft);border-color:#96bfc1}.staff-name{font-weight:800}.staff-role{font-size:12px;color:var(--muted);margin-top:2px}.staff-score{font-size:12px;margin-top:5px;color:var(--teal);font-weight:750}
.privacy{margin-top:13px;padding:10px;border-radius:10px;background:#fff8e8;border:1px solid #ecd9ad;font-size:12px;color:#6f5527}.privacy strong{display:block;margin-bottom:3px;color:#654711}.storage-meter{font-size:12px;color:var(--muted);margin-top:7px}
.empty{padding:70px 24px;text-align:center}.empty h2{font-size:24px;margin:0}.empty p{max-width:620px;margin:8px auto 18px;color:var(--muted)}.subtle{color:var(--muted);font-size:13px}
.toolbar{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.field{display:grid;gap:4px;min-width:145px}.field.grow{flex:1;min-width:220px}.field label{font-size:12px;color:var(--muted);font-weight:750}.field input,.field select,.field textarea,.modal input,.modal select{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;color:var(--ink)}.toolbar-actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.role-summary{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#fafcfd}.role-summary summary{padding:10px 12px;font-weight:750;cursor:pointer;color:var(--navy)}.role-summary[open] summary{border-bottom:1px solid var(--line)}.role-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 12px}.role-box{padding:9px;border-radius:9px;background:#fff;border:1px solid #e4e9ed}.role-box b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--teal);margin-bottom:2px}.role-box span{font-size:12.5px}.role-boundary{grid-column:1/-1;padding:9px 10px;border-left:4px solid var(--amber);background:#fff8e8;border-radius:7px;font-size:12.5px}
.continuum{margin:14px 0 10px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}.continuum-head{padding:10px 12px;background:#f7f9fa;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.continuum-head b{color:var(--navy)}.continuum-head span{font-size:12px;color:var(--muted)}.continuum-grid{display:grid;grid-template-columns:repeat(5,1fr)}.continuum-stage{padding:8px 9px;border-right:1px solid var(--line);min-height:58px}.continuum-stage:last-child{border-right:0}.continuum-stage strong{display:block;font-size:11px;letter-spacing:.025em}.continuum-stage small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.metric{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.metric .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:750}.metric .v{font-size:18px;font-weight:850;margin-top:2px}.metric .s{font-size:11px;color:var(--muted);margin-top:1px}.positive{color:var(--green)}.negative{color:var(--red)}
.eval-instruction{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:10px 0 7px;padding:9px 11px;border-radius:10px;background:var(--teal-soft);border:1px solid #bdd6d7;font-size:12.5px}.eval-instruction label{margin-left:auto;white-space:nowrap}
.section{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff;overflow:hidden;transition:.15s}.section.open{box-shadow:0 5px 16px rgba(24,53,74,.07);border-color:#b8cbd2}.section-head{width:100%;border:0;background:#f8fafb;color:var(--ink);padding:11px 12px;display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;align-items:center;gap:9px;text-align:left}.section.open .section-head{background:#f2f7f8;border-bottom:1px solid var(--line)}.chev{font-size:15px;color:var(--muted);transform:rotate(-90deg);transition:.15s}.section.open .chev{transform:rotate(0)}.section-title{font-weight:820}.section-meta{font-size:11px;color:var(--muted)}.section-note-flag{font-size:10px;color:var(--teal);font-weight:750}.stage-badge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:5px 8px;font-size:10.5px;font-weight:820;white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--muted)}.stage-badge.s1{color:var(--seed);border-color:#d7c2b5;background:#fbf4ef}.stage-badge.s2{color:var(--grow);border-color:#cbd4a9;background:#f7faed}.stage-badge.s3{color:var(--prosper);border-color:#acd1c4;background:#eef8f4}.stage-badge.s4{color:var(--flourish);border-color:#ccb7d1;background:#f8f1fa}.stage-badge.s5{color:#fff;border-color:var(--leader);background:var(--leader)}
.section-body{display:none;padding:12px}.section.open .section-body{display:block}.prompt-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;margin-bottom:6px}.responsibility-list{margin:0 0 12px;padding-left:19px;color:#3b4852;font-size:13px;columns:2;column-gap:30px}.responsibility-list li{margin:0 0 5px;break-inside:avoid}.section-rating{display:grid;grid-template-columns:repeat(5,minmax(90px,1fr));gap:6px}.stage-btn{border:1px solid var(--line);background:#fff;border-radius:9px;min-height:54px;padding:7px 6px;text-align:center;color:#47535d}.stage-btn strong{display:block;font-size:11px}.stage-btn span{display:block;font-size:10px;color:var(--muted);margin-top:1px}.stage-btn:hover{border-color:var(--teal);background:#fbfefe}.stage-btn.sel.s1{border-color:#b98e77;background:#fbf4ef;color:var(--seed)}.stage-btn.sel.s2{border-color:#9dab64;background:#f7faed;color:var(--grow)}.stage-btn.sel.s3{border-color:#65a992;background:#eef8f4;color:var(--prosper)}.stage-btn.sel.s4{border-color:#a17bab;background:#f8f1fa;color:var(--flourish)}.stage-btn.sel.s5{border-color:var(--leader);background:var(--leader);color:#fff}.stage-btn.sel.s5 span{color:rgba(255,255,255,.75)}
.section-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:9px}.text-link{border:0;background:transparent;color:var(--teal);font-size:12px;padding:3px 2px;font-weight:750}.not-assessed{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:11px;color:var(--muted)}.not-assessed.sel{background:#eef1f3;color:#46515a}.section-note{display:none;margin-top:8px}.section-note.show{display:block}.section-note textarea{width:100%;min-height:64px;max-height:140px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 9px}.previous-line{margin-top:7px;font-size:11px;color:var(--muted)}
.reflection{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.reflection summary{padding:10px 12px;font-weight:750;cursor:pointer}.reflection-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:0 12px 12px}.reflection-grid textarea{min-height:72px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 9px}
.savebar{position:sticky;bottom:10px;z-index:10;display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;padding:9px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(24,53,74,.14)}.autosave{margin-right:auto;font-size:12px;color:var(--muted)}
.history-controls,.data-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #e8ecef;vertical-align:top}th{background:#f5f8f9;color:#53606b;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}tr:last-child td{border-bottom:0}.score-badge{display:inline-flex;border-radius:999px;background:var(--teal-soft);color:var(--teal);padding:3px 7px;font-weight:750}.action-link{border:0;background:transparent;color:var(--teal);padding:2px 4px;font-weight:750}.action-link.red{color:var(--red)}
.staff-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.staff-card{border:1px solid var(--line);border-radius:11px;padding:12px}.staff-card h3{margin:0;font-size:16px}.staff-card .meta{font-size:12px;color:var(--muted);margin:4px 0 9px}.staff-card .actions{display:flex;gap:6px}
.rolemap-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.map-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}.map-card h3{margin:0 0 8px}.map-list{margin:0;padding-left:20px}.map-list li{margin:6px 0}.principle{background:var(--teal-soft);border-left:5px solid var(--teal);padding:14px;border-radius:9px;font-weight:650;margin:12px 0 15px}
.modal-backdrop{position:fixed;inset:0;background:rgba(16,27,35,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.open{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:14px;padding:18px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.modal h2{margin:0 0 12px}.modal-grid{display:grid;gap:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.modal label{font-size:12px;font-weight:700;color:var(--muted);display:grid;gap:4px}.toast{position:fixed;right:18px;bottom:18px;z-index:200;background:#173246;color:#fff;padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
@media(max-width:1100px){.shell{grid-template-columns:1fr}.sidebar{position:static;max-height:none}.role-grid,.metrics{grid-template-columns:repeat(2,1fr)}.staff-cards{grid-template-columns:repeat(2,1fr)}.responsibility-list{columns:1}}
@media(max-width:760px){.topbar-inner{padding:10px 12px}.brand{min-width:0}.shell{padding:10px}.panel{padding:12px}.continuum-grid{grid-template-columns:1fr}.continuum-stage{border-right:0;border-bottom:1px solid var(--line);min-height:0}.continuum-stage:last-child{border-bottom:0}.metrics,.role-grid,.reflection-grid,.staff-cards,.rolemap-grid{grid-template-columns:1fr}.section-head{grid-template-columns:20px minmax(0,1fr) auto}.section-note-flag{display:none}.section-rating{grid-template-columns:1fr}.stage-btn{min-height:44px;text-align:left;padding-left:10px}.stage-btn strong,.stage-btn span{display:inline}.stage-btn span:before{content:' — '}.toolbar-actions{margin-left:0}.savebar{bottom:4px}}
@media print{body{background:#fff;font-size:11px}.topbar,.sidebar,.tabs,.toolbar-actions,.savebar,.privacy,.data-actions,.history-controls,.eval-instruction label{display:none!important}.shell{display:block;max-width:none;padding:0}.panel,.section{box-shadow:none;border-color:#bbb}.panel{padding:9px}.view{display:none!important}#evaluateView.active{display:block!important}.section-body{display:block!important}.section{break-inside:avoid}.section-rating .stage-btn{display:none}.section-rating .stage-btn.sel{display:block;min-height:0;border:0;background:transparent!important;color:#111!important;text-align:left;padding:2px}.responsibility-list{columns:2}.role-summary{display:block}.role-summary>summary,.reflection>summary{list-style:none}.reflection-grid{display:grid}.continuum{break-inside:avoid}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <div class="brand"><div class="brand-mark">PHS</div><div><h1>Staff Progress Evaluation</h1><small>Quick self / peer / leader check-ins</small></div></div>
  <nav class="tabs"><button class="tab active" data-view="evaluateView">Evaluate</button><button class="tab" data-view="historyView">History</button><button class="tab" data-view="dataView">Staff &amp; Export</button><button class="tab" data-view="roleMapView">Role Map</button></nav>
</div></header>
<div class="shell">
  <aside class="sidebar">
    <div class="side-head"><h2>Staff</h2><button class="icon-btn" id="addStaffBtn" title="Add staff member">+</button></div>
    <input id="staffSearch" class="staff-search" placeholder="Search staff…">
    <div class="staff-list" id="staffList"></div>
    <div class="privacy"><strong>Local browser records</strong>Drafts and saved evaluations stay in this browser unless you export them. Use a trusted school device/profile and keep a secure JSON backup.</div>
    <div class="storage-meter" id="storageMeter"></div>
  </aside>
  <main class="main">
    <section id="evaluateView" class="view active"></section>
    <section id="historyView" class="view"></section>
    <section id="dataView" class="view"></section>
    <section id="roleMapView" class="view"></section>
  </main>
</div>
<div class="modal-backdrop" id="staffModal"><div class="modal">
  <h2 id="staffModalTitle">Add staff member</h2>
  <div class="modal-grid">
    <label>Name<input id="staffName" autocomplete="off" maxlength="100"></label>
    <label>Default role<select id="staffRole"></select></label>
    <label>Department / area<input id="staffDepartment" autocomplete="off" maxlength="100" placeholder="Optional"></label>
  </div>
  <div class="modal-actions"><button class="secondary" id="cancelStaff">Cancel</button><button class="primary" id="saveStaff">Save staff member</button></div>
</div></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<div class="toast" id="toast"></div>
<script>
const ROLE_DEFS = [{"id":"01","name":"SLT Member","sourceFile":"01_SLT_Member_Responsibilities_Discussion_List.docx","purpose":"Provide school-wide strategic and operational leadership within delegated portfolios, while contributing collectively to whole-school leadership.","oversight":"Principal / Tumuaki, with governance oversight retained by the School Board.","worksWith":"Other SLT members, Pou Taahuu / Faculty Leaders, Pou Tuarongo / year leaders, professional and support staff.","escalation":"Principal for matters outside delegation, major risk, significant staffing matters, serious complaints or strategic decisions.","boundary":"An SLT member should not absorb routine middle-leadership work that properly belongs with faculty, department or pastoral leaders.","sections":[{"number":1,"title":"Strategic Leadership","items":["Translate school strategy and priorities into clear actions within the delegated portfolio.","Make decisions within delegated authority and communicate the reasoning clearly.","Identify emerging risks, opportunities and cross-school implications.","Bring coherent recommendations to the Principal rather than only reporting problems.","Support consistency between strategic intent and day-to-day practice."]},{"number":2,"title":"Line Management and Leadership of Leaders","items":["Set clear expectations for the leaders and staff directly line-managed.","Hold regular purposeful check-ins focused on priorities, people, risk and outcomes.","Develop middle leaders rather than routinely doing their work for them.","Address significant performance or conduct concerns through the correct employment process and delegated authority.","Ensure leaders understand what they own, what requires consultation and what must be escalated."]},{"number":3,"title":"Teaching, Learning and Curriculum Oversight","items":["Maintain oversight of the quality and coherence of teaching and learning within the delegated portfolio.","Support curriculum leaders to respond to curriculum, qualification and assessment changes.","Monitor significant achievement patterns and equity concerns.","Challenge weak systems while allowing leaders reasonable professional autonomy.","Coordinate school-wide decisions where consistency across faculties is required."]},{"number":4,"title":"Pastoral, Student and Safeguarding Oversight","items":["Ensure pastoral and behaviour systems within the portfolio are understood and consistently implemented.","Support year-level leaders with serious, complex or repeated student matters.","Ensure safeguarding, wellbeing and serious safety concerns are escalated and managed under school procedures.","Maintain an appropriate distinction between leadership oversight and specialist counselling, clinical or statutory functions."]},{"number":5,"title":"People, Culture and Communication","items":["Model respectful, calm and professional leadership.","Communicate decisions in time for leaders and staff to act on them.","Invite challenge and relevant information before finalising significant decisions.","Address role confusion, workload risks and duplicated systems early.","Recognise and build leadership capability across the school."]},{"number":6,"title":"Health, Safety and Organisational Risk","items":["Maintain oversight of significant health and safety risks within delegated portfolios.","Ensure hazards and incidents are responded to at the right level and that corrective actions are followed through.","Escalate serious or systemic risk to the Principal immediately.","Check that assurance is based on evidence that systems are operating, not only on policies existing."]},{"number":7,"title":"Resources, Budget and Major Decisions","items":["Work within delegated financial authority.","Ensure major spending decisions align with strategic priorities and approved budgets.","Require middle leaders to plan and prioritise before escalating resource requests.","Coordinate decisions that affect more than one faculty or operational area.","Keep the Principal informed about material budget, property, staffing or operational risks."]},{"number":8,"title":"Policy, Compliance and Documentation","items":["Ensure delegated school policies and procedures are implemented and reviewed as required.","Maintain appropriate records of significant decisions, complaints, staffing matters and risks.","Protect privacy and use information only for legitimate school purposes.","Ensure important systems do not depend on one person holding undocumented knowledge."]},{"number":9,"title":"Community and Whaanau","items":["Support leaders with significant or escalated whaanau concerns.","Manage serious complaints within delegated authority and refer matters appropriately.","Represent the school professionally in community and external relationships.","Support positive communication, not only communication when problems arise."]},{"number":10,"title":"Annual Planning and Review","items":["Review outcomes within the portfolio and identify priorities for the following year.","Identify staffing, capability, budget, property and system needs early.","Recommend changes to the Principal with evidence, options and implications.","Confirm responsibilities and delegated authorities for the next cycle."]}]},{"id":"02","name":"Pou Taahuu / Faculty Leader","sourceFile":"02_Pou Taahuu_Head_of_Faculty_Responsibilities_Discussion_List.docx","purpose":"Lead the whole faculty, develop HODs, create cross-department consistency and provide assurance to SLT.","oversight":"Allocated SLT line leader.","worksWith":"HODs, subject leaders, teachers, technicians/support staff, pastoral leaders and relevant school-wide portfolio holders.","escalation":"SLT for major staffing, serious complaints, significant risk, major capital decisions or issues that cannot be resolved at faculty level.","boundary":"The Pou Taahuu should hold HODs accountable for day-to-day department leadership rather than becoming the default HOD for every department.","sections":[{"number":1,"title":"Leadership of the Faculty","items":["Set clear faculty direction consistent with school priorities.","Lead and develop HODs and other faculty leaders.","Create clarity about what belongs at teacher, HOD, Pou Taahuu and SLT level.","Coordinate issues that cross departments.","Represent faculty needs and risks to SLT."]},{"number":2,"title":"Curriculum and Programme Coherence","items":["Maintain strategic oversight of curriculum across the faculty.","Ensure departments respond to curriculum and qualification changes.","Check progression, pathways and course coherence across departments.","Challenge unnecessary duplication or gaps between departments.","Approve or recommend significant curriculum changes through the correct school process."]},{"number":3,"title":"Teaching and Learning","items":["Promote high-quality teaching across the faculty.","Use evidence, observation and professional dialogue to identify faculty-wide strengths and needs.","Support HODs to improve teaching without taking over routine teacher support.","Coordinate faculty PLD where common needs exist.","Monitor whether agreed teaching approaches are having the intended effect."]},{"number":4,"title":"People and HOD Development","items":["Hold regular leadership conversations with HODs.","Support HODs to solve day-to-day problems independently.","Address significant staff performance or conduct concerns at the appropriate level.","Identify workload, capability and succession risks.","Delegate appropriately and follow up agreed actions."]},{"number":5,"title":"Assessment and NZQA Assurance","items":["Maintain faculty-level oversight of assessment and moderation systems.","Ensure HODs are managing current standards, timelines and moderation within departments.","Identify cross-department assessment risks and inconsistencies.","Escalate significant NZQA or consent-to-assess concerns through the Principal’s Nominee / SLT as appropriate."]},{"number":6,"title":"Student Achievement and Pathways","items":["Monitor faculty-wide achievement and participation patterns.","Identify significant inequities or areas of under-performance.","Require departments to respond to students at risk and evaluate interventions.","Maintain oversight of pathways across the faculty and links to careers, tertiary and industry."]},{"number":7,"title":"Health and Safety Assurance","items":["Maintain faculty-wide assurance that specialist health and safety systems are operating.","Require HODs to implement safe systems within their departments.","Respond promptly to significant hazards, incidents and repeated non-compliance.","Coordinate faculty-level actions, training and resource priorities.","Escalate serious or systemic risks to SLT."]},{"number":8,"title":"Budget, Equipment and Resources","items":["Allocate and monitor faculty budgets in line with school delegations.","Balance priorities between departments.","Review major equipment and capital requests before escalation.","Plan replacement cycles and significant future costs.","Ensure technicians/support staff workloads and resources are workable."]},{"number":9,"title":"Complaints, Behaviour and Whaanau","items":["Support HODs with significant classroom or department issues.","Handle matters escalated beyond HOD level within delegation.","Coordinate with Pou Tuarongo / pastoral leaders when issues are primarily pastoral.","Keep SLT informed about serious or unresolved complaints."]},{"number":10,"title":"Planning and Reporting","items":["Review faculty performance, staffing, curriculum, H&S and resource needs.","Report significant outcomes, risks and recommendations to SLT.","Ensure department plans are ready for the following year.","Maintain continuity of key faculty systems and documentation."]}]},{"id":"03","name":"Head of Department","sourceFile":"03_Head_of_Department_Responsibilities_Discussion_List.docx","purpose":"Lead the day-to-day operation, curriculum, staff support, assessment, resources and improvement of the department.","oversight":"Pou Taahuu / Faculty Leader.","worksWith":"Department teachers, subject leaders, technicians/support staff, pastoral leaders, Principal’s Nominee and relevant school-wide leaders.","escalation":"Pou Taahuu for significant staffing, unresolved complaints, major resource decisions, systemic H&S risk or matters beyond department authority.","boundary":"The HOD leads the department; the Pou Taahuu retains faculty-wide direction, cross-department consistency and major leadership/employment oversight.","sections":[{"number":1,"title":"Leadership of the Department","items":["Provide day-to-day leadership of the subject area.","Set clear expectations for staff within the department.","Communicate faculty and school expectations to department staff.","Keep the Pou Taahuu informed about significant issues.","Bring possible solutions to the Pou Taahuu rather than only identifying problems.","Lead department discussion and decision-making.","Follow through on agreed actions."]},{"number":2,"title":"Curriculum","items":["Lead curriculum planning within the subject area.","Ensure programmes meet current curriculum requirements.","Maintain clear progression from junior to senior courses.","Review programmes of learning regularly.","Coordinate common programmes where multiple teachers teach the same course.","Identify curriculum gaps or unnecessary repetition.","Recommend significant curriculum changes to the Pou Taahuu."]},{"number":3,"title":"Teaching and Learning","items":["Promote high-quality teaching within the department.","Discuss teaching practice regularly with staff.","Share effective strategies and resources.","Support staff who are having difficulty with a class or programme.","Monitor whether programmes are working for students.","Encourage consistency without expecting every teacher to teach identically.","Identify professional learning needs and model good practice."]},{"number":4,"title":"Department Staff","items":["Support and induct teachers within the department.","Check that staff understand department systems and key deadlines.","Regularly check in with staff and identify workload concerns early.","Address minor professional issues appropriately.","Raise significant performance or conduct concerns with the Pou Taahuu.","Delegate appropriate responsibilities rather than doing everything personally."]},{"number":5,"title":"Assessment and NZQA","items":["Coordinate senior assessment within the department.","Ensure current standards and assessment materials are used.","Ensure information given to students is accurate.","Maintain assessment timelines and internal moderation processes.","Keep required moderation evidence and respond to external moderation feedback.","Monitor consistency of assessment decisions.","Raise significant assessment concerns with the Pou Taahuu and/or Principal’s Nominee."]},{"number":6,"title":"Student Achievement","items":["Monitor achievement within department courses.","Know which students are at risk of not achieving.","Identify patterns and equity concerns in achievement data.","Discuss concerns with teachers and agree strategies.","Monitor whether interventions are working.","Report significant concerns or successes to the Pou Taahuu."]},{"number":7,"title":"Health and Safety","items":["Ensure staff follow faculty and school H&S procedures.","Ensure students receive appropriate safety instruction and demonstrate required competency before specialist equipment use.","Monitor safe use of specialist spaces and required PPE.","Ensure hazards, equipment faults, accidents, incidents and near misses are reported.","Remove unsafe equipment from use and coordinate repair/maintenance.","Ensure staff understand emergency procedures.","Raise significant H&S concerns with the Pou Taahuu immediately."]},{"number":8,"title":"Equipment, Resources and Budget","items":["Maintain oversight of department equipment and resources.","Identify repair, replacement and consumable needs.","Prioritise purchases and monitor spending.","Coordinate maintenance with the Pou Taahuu, technicians and property staff as appropriate.","Plan ahead for major replacement costs.","Keep appropriate purchasing records and stay within agreed delegation."]},{"number":9,"title":"Beginning Teachers / PCT Support","items":["Provide or arrange curriculum-specific advice, guidance and support for eligible beginning teachers.","Protect the distinction between curriculum-specific HOD support and school-wide mentoring/induction.","Meet regularly enough to support planning, assessment, behaviour and subject-specific pedagogy.","Ensure concerns are identified early and the PCT knows who to seek help from.","Where HOD beginning-teacher support is formally delegated, ensure the receiving teacher is suitably qualified and the support remains equivalent."]},{"number":10,"title":"Technicians / Support Staff","items":["Communicate clearly and plan work ahead.","Prioritise support-staff workload and make clear what is and is not their responsibility.","Support safe systems of work and raise resource/workload issues with the Pou Taahuu.","Maintain respectful professional relationships between teaching and support staff."]},{"number":11,"title":"Student Behaviour and Whaanau","items":["Support teachers with repeated or more serious department issues.","Ensure unsafe practical-space behaviour is addressed immediately.","Keep appropriate records and work with pastoral leaders when necessary.","Support teachers with parent communication and handle concerns escalated beyond classroom-teacher level.","Refer serious or unresolved matters to the Pou Taahuu."]},{"number":12,"title":"Documentation and Planning","items":["Keep programmes, shared resources, assessment/moderation and H&S documentation current.","Ensure important information is accessible to staff and not held by only one person.","Review courses, achievement, staffing, equipment and H&S needs for the following year.","Have programmes and resources ready for the start of the following year."]}]},{"id":"04","name":"Pou Tuarongo / Dean","sourceFile":"04_Head_of_Year_Kaitiaki_Aakonga_Responsibilities_Discussion_List.docx","purpose":"Lead pastoral care, attendance, behaviour escalation and year-level coordination for a defined cohort of aakonga.","oversight":"SLT member responsible for pastoral care / student support.","worksWith":"Kaiaawhina, classroom teachers, HODs, Pou Taahuu, guidance/wellbeing staff, attendance staff, learning support, whaanau and external agencies as appropriate.","escalation":"Pastoral SLT for serious safeguarding, high-risk wellbeing, major behaviour, legal/statutory matters, serious complaints or suspension/exclusion-level decisions.","boundary":"The Pou Tuarongo / Dean coordinates and leads pastoral support; they are not the default classroom behaviour manager, counsellor, clinician or investigator for every issue.","sections":[{"number":1,"title":"Pastoral and Year-Level Leadership","items":["Set clear year-level expectations and routines.","Provide timely communication to Kaiaawhina and relevant teachers.","Coordinate year-level meetings, assemblies and key events.","Build a consistent, inclusive year-level culture.","Keep SLT informed about significant patterns and risks."]},{"number":2,"title":"Attendance and Engagement","items":["Monitor attendance patterns and identify concerns early.","Coordinate follow-up when classroom/form-level actions have not resolved attendance concerns.","Work with whaanau and attendance staff using school procedures.","Record significant actions and referrals.","Escalate persistent or high-risk non-attendance appropriately."]},{"number":3,"title":"Behaviour and Restorative Practice","items":["Receive repeated or significant behaviour issues after appropriate classroom/department responses.","Support consistent use of the school behaviour framework.","Coordinate responses where issues span multiple subjects.","Use restorative and relationship-based approaches where appropriate.","Escalate serious incidents through SLT procedures."]},{"number":4,"title":"Wellbeing and Safeguarding","items":["Recognise when a concern requires specialist wellbeing, safeguarding or statutory support.","Make referrals through the correct school pathway.","Share information on a need-to-know basis and protect privacy.","Ensure urgent safety concerns are not left waiting for a routine meeting.","Follow up that referred concerns have reached the right person/system."]},{"number":5,"title":"Kaiaawhina / Homeroom Support","items":["Set clear expectations for year-level homeroom routines.","Support Kaiaawhina with attendance, student connection and communication.","Provide information needed for assemblies, year-level notices and transitions.","Avoid passing specialist case-management responsibilities to Kaiaawhina.","Use Kaiaawhina observations as an early-warning source while respecting confidentiality."]},{"number":6,"title":"Academic and Pastoral Coordination","items":["Monitor students whose pastoral circumstances are affecting learning.","Coordinate with HODs/Pou Taahuu when concerns span several subjects.","Support sensible plans for students with significant barriers to engagement.","Avoid taking over subject-specific teaching or assessment decisions.","Identify patterns that require a school-wide response."]},{"number":7,"title":"Whaanau Communication","items":["Support teachers and Kaiaawhina with significant pastoral communication.","Lead communication for complex year-level pastoral matters within delegation.","Keep communication factual, respectful and timely.","Escalate serious or unresolved complaints to SLT.","Promote positive contact with whaanau, not only problem-focused contact."]},{"number":8,"title":"Records, Privacy and Handover","items":["Maintain accurate records of significant pastoral actions and decisions.","Use KAMAR/approved systems consistently.","Ensure sensitive information is shared only with those who need it for legitimate school purposes.","Provide clear handover between year levels or staff when responsibility changes."]},{"number":9,"title":"Safety, Duty and Emergency Responsibilities","items":["Know the year-level role in evacuation, lockdown and emergency procedures.","Support accurate accounting for students during emergency processes.","Respond immediately to serious threats to student or staff safety and involve SLT/emergency services as procedures require."]},{"number":10,"title":"Transitions and Annual Planning","items":["Prepare students and whaanau for year transitions, subject choices and key milestones.","Review year-level trends and identify priorities for the following year.","Identify students who need planned transition support.","Provide clear handover information to the next year-level leader."]}]},{"id":"05","name":"Subject Leader / TIC","sourceFile":"05_Subject_Leader_TIC_Responsibilities_Discussion_List.docx","purpose":"Coordinate a defined subject/course area and provide practical curriculum leadership under the HOD’s department-wide direction.","oversight":"Head of Department.","worksWith":"Teachers of the subject/course, HOD, technicians/support staff, assessment leaders and relevant pathway partners.","escalation":"HOD for staffing, major curriculum changes, significant assessment concerns, unresolved student/parent issues, budget decisions or H&S risk.","boundary":"The Subject Leader coordinates the defined subject/course; department-wide staffing, performance management, budget ownership and strategic decisions remain with the HOD unless formally delegated.","sections":[{"number":1,"title":"Subject / Course Coordination","items":["Maintain a clear shared plan for the subject or course.","Ensure teachers know key content, timing and common expectations.","Coordinate common resources where useful.","Identify gaps, repetition or sequencing issues and bring recommendations to the HOD.","Keep the HOD informed about significant issues."]},{"number":2,"title":"Teaching and Learning","items":["Share practical subject-specific strategies and resources.","Support consistency of core learning expectations while allowing professional judgement.","Identify areas where teachers need additional subject knowledge or support.","Model effective subject practice.","Use student work and outcomes to review programme effectiveness."]},{"number":3,"title":"Assessment and Moderation","items":["Coordinate assessment tasks and timelines for the subject/course.","Ensure current assessment materials and conditions are used.","Coordinate internal moderation and retain required evidence.","Identify inconsistent assessment decisions and resolve them with the HOD where necessary.","Raise significant NZQA issues promptly."]},{"number":4,"title":"Resources and Specialist Spaces","items":["Maintain oversight of resources specifically allocated to the subject/course.","Plan consumables and preparation needs in good time.","Report equipment faults and replacement needs.","Coordinate technician support through agreed department systems.","Avoid committing department funds without delegated authority."]},{"number":5,"title":"Health and Safety","items":["Apply department H&S systems consistently within the subject/course.","Ensure teachers/students receive subject-specific safety guidance where required.","Raise hazards, unsafe equipment or unsafe programme design with the HOD immediately.","Do not create local workarounds that undermine department safety procedures."]},{"number":6,"title":"Student Achievement and Support","items":["Monitor achievement patterns within the subject/course.","Identify students or groups needing additional support.","Coordinate subject-specific interventions with teachers.","Escalate wider pastoral patterns through the HOD/Pou Tuarongo / Dean as appropriate."]},{"number":7,"title":"Communication and Documentation","items":["Keep shared subject/course documentation current.","Record important decisions and agreed changes.","Ensure resources and key information are accessible to all teachers of the course.","Communicate deadlines and changes early enough for staff to act."]},{"number":8,"title":"Planning for the Following Year","items":["Review the course and recommend changes.","Identify resource, assessment and pathway needs.","Prepare shared plans/resources for the start of the year.","Bring significant changes to the HOD for approval."]}]},{"id":"06","name":"Full-Time Teacher","sourceFile":"06_Full_Time_Teacher_Responsibilities_Discussion_List.docx","purpose":"Plan, teach, assess and manage safe, inclusive learning for assigned classes while contributing professionally to department and school systems.","oversight":"HOD / curriculum leader for teaching and curriculum; relevant pastoral leader for escalated pastoral matters; professional leader for school-wide professional expectations.","worksWith":"Students, whaanau, HOD/subject leaders, pastoral leaders, learning support, technicians/support staff and colleagues.","escalation":"HOD for curriculum/class/assessment issues; Pou Tuarongo / Dean for cross-subject pastoral matters; Pou Taahuu/SLT for serious or unresolved matters through normal pathways.","boundary":"The teacher owns their classroom and routine professional responsibilities; middle leaders should support and escalate appropriately rather than routinely taking over normal classroom work.","sections":[{"number":1,"title":"Planning and Teaching","items":["Plan lessons and programmes aligned with department/school expectations.","Know the learning purpose and communicate expectations clearly.","Use suitable teaching strategies for the learners in the class.","Adapt teaching using evidence of student understanding and progress.","Prepare required resources and specialist spaces in time."]},{"number":2,"title":"Classroom Culture and Relationships","items":["Establish calm, respectful and inclusive classroom routines.","Build relationships that support learning and belonging.","Use the school behaviour framework consistently.","Address routine low-level behaviour in the classroom.","Seek support when behaviour becomes repeated, serious or unsafe."]},{"number":3,"title":"Assessment and Feedback","items":["Use agreed assessment conditions, tasks and timelines.","Provide accurate, useful feedback and feed-forward.","Make assessment decisions consistently and participate in moderation.","Keep assessment records accurate and secure.","Raise concerns about assessment validity or workload with the HOD early."]},{"number":4,"title":"Student Achievement and Inclusion","items":["Know which students are making expected progress and who needs additional support.","Use available learning-support information appropriately.","Provide reasonable classroom adjustments and follow agreed plans.","Communicate concerns early rather than waiting until reporting time.","Celebrate student progress and success."]},{"number":5,"title":"Health and Safety","items":["Follow school and department health and safety procedures and instructions.","Give students the safety instruction and supervision required for the activity being taught.","Use only equipment and spaces for which the teacher is competent and authorised.","Stop or modify an activity when conditions are unsafe, and report hazards, faults, incidents and near misses promptly.","Use required PPE and ensure students do the same in specialist environments."]},{"number":6,"title":"Whaanau Communication","items":["Communicate professionally and respectfully with whaanau about learning and routine concerns.","Keep factual records of significant communication.","Involve the HOD or pastoral leader when a concern becomes repeated, serious or cross-subject.","Refer serious complaints through the correct leadership pathway."]},{"number":7,"title":"Department Contribution","items":["Attend and contribute to required department/faculty meetings.","Share resources and information rather than creating avoidable single-person systems.","Meet agreed deadlines.","Contribute to moderation, curriculum review and common planning.","Raise practical problems with possible solutions."]},{"number":8,"title":"Professional Responsibilities","items":["Maintain a current practising certificate and engage in required professional growth/learning processes.","Follow the Code/Standards and school professional expectations.","Protect student privacy and confidential information.","Complete required administrative tasks accurately and on time.","Seek professional support when unsure rather than guessing in high-risk situations."]},{"number":9,"title":"School Contribution","items":["Carry out allocated duties and reasonable school responsibilities.","Support school events, emergency procedures and student supervision expectations.","Communicate absences and provide suitable relief work when required.","Contribute to a positive professional staff culture."]}]},{"id":"07","name":"PCT / Beginning Teacher — Year 1","sourceFile":"07_PCT_Beginning_Teacher_Year_1_Responsibilities_Discussion_List.docx","purpose":"Teach assigned classes safely and professionally while participating in a structured induction and mentoring programme and developing increasing independence.","oversight":"HOD / curriculum leader plus designated mentor and the school professional leader responsible for induction/certification.","worksWith":"HOD/subject leaders, mentor, PCT coordinator, pastoral leaders, learning support, technicians/support staff and whaanau.","escalation":"Seek support earlier than an experienced teacher would be expected to when unsure about curriculum, assessment, behaviour, safety, professional judgement or school systems.","boundary":"A Year 1 teacher is responsible for their classes and professional conduct, but is meeting the Standards with support and should not be left to invent school, curriculum or assessment systems alone.","sections":[{"number":1,"title":"Getting Established","items":["Learn the school, department and year-level systems that affect assigned classes.","Know who to contact for curriculum, pastoral, H&S, assessment and professional support.","Use mentor/HOD meetings to ask questions early.","Keep key deadlines, routines and procedures visible and manageable."]},{"number":2,"title":"Planning and Teaching","items":["Plan lessons with clear learning purposes and suitable sequencing.","Use department programmes and shared resources rather than rebuilding everything from scratch.","Trial strategies, reflect on what happened and discuss adjustments with mentor/HOD.","Develop routines that reduce unnecessary workload and increase consistency."]},{"number":3,"title":"Classroom Relationships and Behaviour","items":["Establish explicit routines and expectations.","Use the school behaviour framework and seek coaching on difficult situations.","Address routine behaviour while escalating serious, repeated or unsafe issues.","Ask for observation/support before a pattern becomes unmanageable."]},{"number":4,"title":"Assessment and Reporting","items":["Learn department assessment and moderation systems before making high-stakes decisions independently.","Use current materials and agreed conditions.","Participate actively in moderation and ask when evidence is borderline or unclear.","Meet reporting deadlines with support where needed."]},{"number":5,"title":"Health and Safety","items":["Follow school and department health and safety procedures and instructions.","Give students the safety instruction and supervision required for the activity being taught.","Use only equipment and spaces for which the teacher is competent and authorised.","Stop or modify an activity when conditions are unsafe, and report hazards, faults, incidents and near misses promptly.","Use required PPE and ensure students do the same in specialist environments.","Ask for direct guidance before using unfamiliar specialist equipment, processes or hazardous substances.","Do not assume prior personal experience is equivalent to school authorisation or competency."]},{"number":6,"title":"Induction and Mentoring","items":["Participate consistently in the school induction and mentoring programme.","Set professional goals with the mentor/professional leader.","Engage in observation, feedback, professional learning and reflection.","Keep the agreed records of learning and development needed for the programme.","Discuss readiness for increased independence rather than simply accumulating paperwork."]},{"number":7,"title":"Working with the HOD","items":["Use curriculum-specific support for planning, subject pedagogy, assessment and department systems.","Bring questions and examples of student work/lesson plans where useful.","Tell the HOD early when workload, behaviour, assessment or programme issues are emerging.","Follow through on agreed actions and report back on what happened."]},{"number":8,"title":"Whaanau and Professional Communication","items":["Use factual, respectful communication and seek support for difficult conversations.","Ask a leader to join or advise when a conversation is likely to be complex or contentious.","Keep appropriate records of significant communication.","Protect privacy and confidentiality."]},{"number":9,"title":"Professional Growth and Certification","items":["Work toward demonstrating the current Teaching Council Standards / Ngā Paerewa through everyday practice and the induction programme.","Use feedback as evidence for growth rather than treating support as a sign of failure.","Know who the professional leader is who will make/endorse the formal certification decision.","Raise any uncertainty about certification progress early."]}]},{"id":"08","name":"PCT / Beginning Teacher — Year 2","sourceFile":"08_PCT_Beginning_Teacher_Year_2_Responsibilities_Discussion_List.docx","purpose":"Consolidate effective classroom practice, demonstrate increasing independence and complete the induction/mentoring work needed for readiness for full certification.","oversight":"HOD / curriculum leader plus designated mentor and school professional leader responsible for induction/certification.","worksWith":"HOD/subject leaders, mentor, PCT coordinator, pastoral leaders, learning support, technicians/support staff and whaanau.","escalation":"Continue to seek support promptly for significant curriculum, behaviour, assessment, safety, professional or workload issues while taking greater ownership of routine decisions.","boundary":"Year 2 is not “unsupported teacher lite”; the teacher should be increasingly independent while still receiving structured advice, guidance and mentoring.","sections":[{"number":1,"title":"Consolidating Classroom Practice","items":["Run predictable classroom routines with increasing confidence.","Plan coherent sequences rather than isolated lessons.","Adapt teaching using evidence of student progress.","Identify recurring problems and trial deliberate improvements.","Seek targeted feedback on specific areas rather than waiting for general observation."]},{"number":2,"title":"Curriculum and Subject Knowledge","items":["Strengthen understanding of curriculum progression and course pathways.","Take greater ownership of adapting shared programmes for actual learners.","Contribute useful resources and ideas to the department.","Identify curriculum questions and bring reasoned options to the HOD."]},{"number":3,"title":"Assessment and Moderation","items":["Make routine assessment decisions with increasing confidence.","Use moderation strategically for difficult or high-stakes judgements.","Understand how assessment decisions affect student pathways and reporting.","Contribute to improving shared assessment materials where appropriate."]},{"number":4,"title":"Behaviour, Relationships and Pastoral Judgement","items":["Manage routine classroom behaviour consistently.","Recognise when an issue is classroom-based, department-based or primarily pastoral.","Use records and communication to show patterns rather than relying on memory.","Escalate serious or cross-subject issues through the correct pathway."]},{"number":5,"title":"Health and Safety","items":["Follow school and department health and safety procedures and instructions.","Give students the safety instruction and supervision required for the activity being taught.","Use only equipment and spaces for which the teacher is competent and authorised.","Stop or modify an activity when conditions are unsafe, and report hazards, faults, incidents and near misses promptly.","Use required PPE and ensure students do the same in specialist environments.","Demonstrate consistent judgement about when to stop, modify or seek advice on practical activities."]},{"number":6,"title":"Induction, Mentoring and Reflection","items":["Continue regular mentoring/induction activity rather than allowing it to disappear as confidence grows.","Use professional goals linked to actual learner outcomes and teaching practice.","Engage with observation, feedback and professional learning.","Maintain the agreed record of progress toward full certification."]},{"number":7,"title":"Increasing Professional Independence","items":["Bring likely solutions as well as problems to the HOD/mentor.","Follow through on agreed actions and evaluate the result.","Take responsibility for routine whaanau communication and class administration.","Ask for support early on unfamiliar or high-risk matters.","Avoid equating independence with working in isolation."]},{"number":8,"title":"Readiness for Full Certification","items":["Discuss progress toward the Standards / Ngā Paerewa explicitly with mentor and professional leader.","Identify any gaps in experience or evidence before the end of the programme.","Complete agreed actions needed before an endorsement decision.","Understand that the professional leader makes an evidence-based judgement about readiness."]},{"number":9,"title":"Contribution to Department and School","items":["Contribute to shared planning, moderation and professional discussion.","Support colleagues through practical sharing without taking on inappropriate leadership load.","Participate reliably in school duties, meetings and events.","Begin identifying possible future areas of professional contribution."]}]},{"id":"09","name":"PCT Mentor","sourceFile":"09_PCT_Mentor_Responsibilities_Discussion_List.docx","purpose":"Provide structured professional mentoring that helps a beginning teacher grow, reflect, meet the Standards and move toward appropriate independence.","oversight":"School professional leader / person responsible for induction and certification processes.","worksWith":"Beginning teacher, HOD/curriculum leader, subject leaders, Specialist Classroom Teacher where relevant and other support staff.","escalation":"Professional leader for certification concerns, serious professional issues, unresolved support needs or matters outside the mentor role.","boundary":"Mentoring is developmental support. It does not replace the HOD’s curriculum-specific responsibility, the employer’s formal competence/conduct processes, or the professional leader’s certification decision.","sections":[{"number":1,"title":"Establishing the Programme","items":["Clarify mentor, HOD, PCT coordinator and professional leader responsibilities at the start.","Agree a regular meeting rhythm and practical communication method.","Help the teacher identify realistic goals based on current practice and learner needs.","Ensure the teacher knows what records are expected and why."]},{"number":2,"title":"Professional Dialogue","items":["Create space for honest discussion without turning every meeting into compliance checking.","Ask questions that help the teacher analyse what students are doing and learning.","Give specific, actionable feedback.","Balance encouragement with appropriate challenge.","Follow up previous actions."]},{"number":3,"title":"Observation and Feedback","items":["Arrange or support useful observations of the beginning teacher.","Help the beginning teacher observe effective practice in others.","Focus observations on agreed questions or goals.","Separate developmental feedback from any formal employment process unless the school has explicitly moved into such a process."]},{"number":4,"title":"Standards and Evidence","items":["Help the teacher understand how current Standards / Ngā Paerewa connect to everyday practice.","Use naturally occurring evidence rather than creating unnecessary paperwork.","Identify gaps in experience or evidence early.","Support the teacher to reflect on impact on learners."]},{"number":5,"title":"Coordination with the HOD","items":["Ensure curriculum-specific issues reach the HOD or delegated curriculum support person.","Avoid duplicating the HOD’s subject-specific support unnecessarily.","Share relevant support information with consent/need-to-know judgement while protecting appropriate confidentiality.","Coordinate support when classroom issues have both pedagogical and pastoral dimensions."]},{"number":6,"title":"Workload and Wellbeing","items":["Check whether workload is allowing the teacher to use advice/guidance time productively.","Help the teacher prioritise and avoid unnecessary reinvention.","Encourage early help-seeking when workload or stress affects safe/effective practice.","Escalate serious wellbeing or safety concerns through school procedures."]},{"number":7,"title":"Concerns and Escalation","items":["Raise recurring professional concerns early and factually.","Do not promise confidentiality that would prevent action on safety, safeguarding or serious professional concerns.","If a concern may become a competence/conduct matter, involve the correct professional leader rather than trying to manage it informally forever.","Keep mentoring notes professional and appropriate."]},{"number":8,"title":"Readiness for Full Certification","items":["Review progress over time with the beginning teacher.","Identify remaining development needs before an endorsement decision is due.","Provide relevant professional evidence/feedback to the person responsible for the final decision.","Do not make promises about certification outcomes beyond your delegated role."]}]},{"id":"10","name":"Kaiaawhina / Homeroom Teacher","sourceFile":"10_Kaiaawhina_Homeroom_Teacher_Responsibilities_Discussion_List.docx","purpose":"Provide a consistent daily point of connection for students, complete required homeroom administration and identify concerns early for referral.","oversight":"Pou Tuarongo / Dean.","worksWith":"Students, whaanau, Pou Tuarongo / Dean, classroom teachers, attendance staff, learning support and wellbeing staff.","escalation":"Pou Tuarongo / Dean for repeated attendance, wellbeing, behaviour or whaanau concerns; urgent safeguarding/safety issues through immediate school procedures.","boundary":"Kaiaawhina are an early connection and referral point; they should not become sole case managers, counsellors or investigators for complex student issues.","sections":[{"number":1,"title":"Daily Connection and Relationships","items":["Know the students in the homeroom group and notice meaningful changes.","Create a calm, respectful and predictable homeroom routine.","Provide key notices and year-level information.","Encourage belonging, participation and positive school connection."]},{"number":2,"title":"Attendance and Rolls","items":["Mark required rolls accurately and on time.","Follow up obvious discrepancies using school procedures.","Notice patterns and refer repeated concerns to the Pou Tuarongo / Dean/attendance system.","Do not independently investigate complex attendance matters beyond the role."]},{"number":3,"title":"Pastoral Check-In","items":["Listen appropriately when students raise concerns.","Distinguish between a routine issue, a referral and an urgent safety concern.","Record/referral information through approved systems.","Follow up that a student has reached the right support person where appropriate."]},{"number":4,"title":"Whaanau Communication","items":["Make routine positive or practical contact where expected by the school/year level.","Keep communication respectful and factual.","Refer complex, contentious or high-risk matters to the Pou Tuarongo / Dean.","Protect student privacy."]},{"number":5,"title":"Year-Level Routines and Assemblies","items":["Prepare students for year-level assemblies and key events.","Support consistent year-level expectations.","Complete any required roll/accounting processes.","Communicate Pou Tuarongo / Dean instructions accurately and promptly."]},{"number":6,"title":"Emergency Procedures","items":["Know evacuation and lockdown procedures for the homeroom role.","Account for students as directed during evacuation/assembly procedures.","Report missing/unaccounted students promptly.","Follow SLT/Pou Tuarongo / Dean/emergency-service directions."]},{"number":7,"title":"Working with Pou Tuarongo / Dean","items":["Bring patterns rather than isolated impressions where possible.","Share relevant factual information early.","Follow through on agreed actions.","Avoid carrying serious concerns alone because you do not want to “bother” the Pou Tuarongo / Dean."]}]},{"id":"11","name":"Technician / Specialist Support Staff","sourceFile":"11_Technician_Support_Staff_Responsibilities_Discussion_List.docx","purpose":"Provide safe, timely technical and resource support that enables teaching programmes to operate effectively.","oversight":"HOD or designated support-staff line manager, with Pou Taahuu/operations oversight as locally delegated.","worksWith":"Teachers, HOD, Pou Taahuu, property/maintenance staff, suppliers, students where appropriate and H&S personnel.","escalation":"HOD/line manager for workload, safety, stock, equipment or role-boundary concerns; urgent hazards immediately through H&S procedures.","boundary":"Technicians support teaching; they do not automatically own curriculum decisions, classroom behaviour, teacher planning or duties that require teacher registration unless separately employed/authorised for those functions.","sections":[{"number":1,"title":"Preparation for Teaching","items":["Prepare agreed materials, equipment and spaces in time for practical learning.","Use planning systems that allow work to be prioritised.","Tell teachers early when a request cannot be completed safely or on time.","Encourage reasonable lead times rather than normalising last-minute requests."]},{"number":2,"title":"Equipment and Maintenance","items":["Carry out routine checks and maintenance within training, competency and delegated authority.","Identify equipment needing repair, servicing or replacement.","Isolate/label unsafe equipment and report it promptly.","Coordinate external servicing through agreed processes.","Keep relevant maintenance/service records."]},{"number":3,"title":"Health and Safety","items":["Follow safe systems of work, PPE and hazardous-substance procedures.","Report hazards, incidents and near misses.","Do not undertake work outside competency or authorisation.","Support teachers to keep practical environments orderly and ready for safe use.","Raise repeated unsafe practices with the HOD/line manager."]},{"number":4,"title":"Stock and Consumables","items":["Monitor stock levels and likely programme demand.","Store materials, tools and hazardous substances correctly.","Reduce avoidable waste and identify unusual consumption.","Prepare purchase requests within delegated systems.","Maintain appropriate records where required."]},{"number":5,"title":"Supporting Staff","items":["Explain technical constraints and safe options clearly.","Help new staff understand preparation, equipment and workshop/kitchen/lab systems.","Share specialist knowledge within the boundaries of the role.","Maintain professional, respectful working relationships."]},{"number":6,"title":"Students and Practical Spaces","items":["Support student practical work only with   </div>`;
  document.getElementById('evalRole').value=role.id;document.getElementById('evalType').value=activeEval.type||'Self';
  document.getElementById('evalRole').addEventListener('change',e=>{saveDraft();const rid=e.target.value;const key=draftKey(s.id,rid);activeEval=state.drafts[key]?structuredClone(state.drafts[key]):null;if(!activeEval)ensureActiveEval(false,rid);openSectionIndex=firstUnassessedIndex(roleById(rid),activeEval);if(openSectionIndex<0)openSectionIndex=0;renderEvaluate()});
  ['evalType','evaluatorName','evalDate'].forEach(id=>document.getElementById(id).addEventListener('change',e=>{if(id==='evalType')activeEval.type=e.target.value;if(id==='evaluatorName')activeEval.evaluator=e.target.value;if(id==='evalDate')activeEval.date=e.target.value;saveDraft()}));
  document.getElementById('autoAdvance').addEventListener('change',e=>{state.settings.autoAdvance=e.target.checked;persist()});
  document.getElementById('editStaffBtn').addEventListener('click',()=>openStaffModal(s.id));document.getElementById('newEvalBtn').addEventListener('click',startNewEvaluation);document.getElementById('copyPrevBtn').addEventListener('click',copyPrevious);document.getElementById('saveDraftBtn').addEventListener('click',()=>{saveDraft();toast('Draft saved')});document.getElementById('saveEvalBtn').addEventListener('click',saveEvaluation);
  root.querySelectorAll('[data-section-toggle]').forEach(b=>b.addEventListener('click',()=>{const si=Number(b.dataset.sectionToggle);openSectionIndex=openSectionIndex===si?-1:si;renderEvaluate()}));
  root.querySelectorAll('[data-section-stage]').forEach(b=>b.addEventListener('click',()=>{const si=Number(b.dataset.sectionStage),raw=b.dataset.stage;activeEval.sectionRatings[si]=raw==='na'?'na':Number(raw);saveDraft();if(state.settings.autoAdvance!==false){const next=firstUnassessedIndex(role,activeEval,si+1);openSectionIndex=next>=0?next:-1}else openSectionIndex=si;renderEvaluate();if(openSectionIndex<0)toast('All responsibility sections have a judgement')}));
  root.querySelectorAll('[data-note-toggle]').forEach(b=>b.addEventListener('click',()=>{const si=Number(b.dataset.noteToggle),wrap=root.querySelector(`[data-section-note-wrap="${si}"]`);wrap.classList.toggle('show');if(wrap.classList.contains('show'))setTimeout(()=>wrap.querySelector('textarea').focus(),20)}));
  root.querySelectorAll('[data-section-note]').forEach(t=>t.addEventListener('input',()=>{activeEval.sectionNotes[t.dataset.sectionNote]=t.value;saveDraft()}));
  ['strengths','nextFocus','supportNeeded'].forEach(id=>document.getElementById(id).addEventListener('input',e=>{activeEval[id]=e.target.value;saveDraft()}));
}
function renderHistory(){
  const root=document.getElementById('historyView'),staffOpts=state.staff.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');root.innerHTML=`<div class="panel"><h2>Saved evaluation history</h2><div class="subtle">Each record is a dated role check-in using the Arotake Whaiaro continuum.</div><div class="history-controls"><select id="histStaff"><option value="">All staff</option>${staffOpts}</select><select id="histRole"><option value="">All roles</option>${ROLE_DEFS.map(r=>`<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('')}</select></div><div id="historyTable"></div></div>`;
  const draw=()=>{const sf=document.getElementById('histStaff').value,rf=document.getElementById('histRole').value;const rows=[...state.evaluations].filter(e=>(!sf||e.staffId===sf)&&(!rf||e.roleId===rf)).sort((a,b)=>(b.date+(b.updatedAt||'')).localeCompare(a.date+(a.updatedAt||'')));document.getElementById('historyTable').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Staff</th><th>Role</th><th>Type</th><th>Overall position</th><th>Sections</th><th></th></tr></thead><tbody>${rows.map(e=>{const s=staffById(e.staffId)||{},st=evaluationStats(e);return `<tr><td>${e.date}</td><td><b>${escapeHtml(s.name||'Unknown')}</b></td><td>${escapeHtml(roleById(e.roleId).name)}</td><td>${escapeHtml(e.type||'')}</td><td><span class="score-badge">${escapeHtml(stageLabel(st.overall))}</span></td><td>${st.assessed}/${st.total}</td><td><button class="action-link" onclick="openEvaluation('${e.id}')">Open</button><button class="action-link red" onclick="deleteEvaluation('${e.id}')">Delete</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty" style="padding:35px"><p>No saved evaluations match this view.</p></div>'};
  document.getElementById('histStaff').addEventListener('change',draw);document.getElementById('histRole').addEventListener('change',draw);draw();
}
function renderData(){const root=document.getElementById('dataView');root.innerHTML=`<div class="panel"><h2>Staff records &amp; export</h2><div class="subtle">Keep staff records in this browser, export analysis files, or make a full backup for secure transfer.</div><div class="data-actions"><button class="primary" onclick="openStaffModal()">Add staff member</button><button class="secondary" onclick="exportJSON()">Full backup (.json)</button><button class="secondary" onclick="document.getElementById('importFile').click()">Import / restore</button><button class="secondary" onclick="exportSummaryCSV()">Summary CSV</button><button class="secondary" onclick="exportDetailedCSV()">Section detail CSV</button><button class="danger" onclick="clearAllData()">Clear all local data</button></div><div class="privacy" style="max-width:900px"><strong>Important privacy note</strong>This page has no server or login. Browser localStorage is convenient but is not an HR records system and is not encrypted by this page. Use a trusted school user profile/device and export backups to an approved secure location.</div><h3>Staff records</h3><div class="staff-cards">${state.staff.length?state.staff.map(s=>{const evals=state.evaluations.filter(e=>e.staffId===s.id);return `<div class="staff-card"><h3>${escapeHtml(s.name)}</h3><div class="meta">${escapeHtml(roleById(s.roleId).name)}${s.department?' · '+escapeHtml(s.department):''}<br>${evals.length} saved evaluation${evals.length===1?'':'s'}</div><div class="actions"><button class="small-btn" onclick="openStaffModal('${s.id}')">Edit</button><button class="danger" onclick="deleteStaff('${s.id}')">Delete</button></div></div>`}).join(''):'<div class="subtle">No staff added yet.</div>'}</div></div>`}
function renderRoleMap(){const root=document.getElementById('roleMapView');root.innerHTML=`<div class="panel"><h2>Responsibility &amp; oversight role map</h2><div class="subtle">Reference view for keeping ownership, oversight and escalation aligned.</div><div class="principle">${escapeHtml(CORE_PRINCIPLE)}</div><div class="rolemap-grid"><div class="map-card"><h3>Suggested responsibility cascade</h3><ol class="map-list">${ROLE_CASCADE.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ol></div><div class="map-card"><h3>Cross-role rules that prevent gaps</h3><ul class="map-list">${ROLE_RULES.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div></div><div class="map-card" style="margin-top:14px"><h3>Role boundaries at a glance</h3><div class="table-wrap"><table><thead><tr><th>Role</th><th>Oversight</th><th>First escalation</th><th>Key boundary</th></tr></thead><tbody>${ROLE_DEFS.map(r=>`<tr><td><b>${escapeHtml(r.name)}</b></td><td>${escapeHtml(r.oversight)}</td><td>${escapeHtml(r.escalation)}</td><td>${escapeHtml(r.boundary)}</td></tr>`).join('')}</tbody></table></div></div></div>`}
function renderAll(){renderStaffList();renderEvaluate();renderHistory();renderData();renderRoleMap();updateStorageMeter()}
function switchView(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===id));if(id==='historyView')renderHistory();if(id==='dataView')renderData();if(id==='roleMapView')renderRoleMap()}

function openStaffModal(id=null){editingStaffId=id;const s=id?staffById(id):null;document.getElementById('staffModalTitle').textContent=s?'Edit staff member':'Add staff member';document.getElementById('staffName').value=s?.name||'';document.getElementById('staffRole').innerHTML=ROLE_DEFS.map(r=>`<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('');document.getElementById('staffRole').value=s?.roleId||'06';document.getElementById('staffDepartment').value=s?.department||'';document.getElementById('staffModal').classList.add('open');setTimeout(()=>document.getElementById('staffName').focus(),20)}
function closeStaffModal(){document.getElementById('staffModal').classList.remove('open');editingStaffId=null}
function saveStaffFromModal(){const name=document.getElementById('staffName').value.trim();if(!name){toast('Enter the staff member’s name');return}const roleId=document.getElementById('staffRole').value,department=document.getElementById('staffDepartment').value.trim();if(editingStaffId){const s=staffById(editingStaffId),oldRole=s.roleId;s.name=name;s.roleId=roleId;s.department=department;if(selectedStaffId===s.id&&oldRole!==roleId)activeEval=null;toast('Staff record updated')}else{const s={id:uid('staff'),name,roleId,department,createdAt:new Date().toISOString()};state.staff.push(s);selectedStaffId=s.id;activeEval=null;toast('Staff member added')}persist();closeStaffModal();ensureActiveEval();renderAll()}
function deleteStaff(id){const s=staffById(id);if(!s)return;const count=state.evaluations.filter(e=>e.staffId===id).length;if(!confirm(`Delete ${s.name} and ${count} saved evaluation(s) from this browser? Export a backup first if you may need them.`))return;state.staff=state.staff.filter(x=>x.id!==id);state.evaluations=state.evaluations.filter(e=>e.staffId!==id);Object.keys(state.drafts).forEach(k=>{if(k.startsWith(id+'::'))delete state.drafts[k]});if(selectedStaffId===id)selectedStaffId=state.staff[0]?.id||null;activeEval=null;persist();renderAll();toast('Staff record deleted')}
function deleteEvaluation(id){const e=state.evaluations.find(x=>x.id===id);if(!e||!confirm('Delete this saved evaluation?'))return;state.evaluations=state.evaluations.filter(x=>x.id!==id);if(activeEval?.id===id){activeEval.saved=false;state.drafts[draftKey(activeEval.staffId,activeEval.roleId)]=structuredClone(activeEval)}persist();renderAll();toast('Evaluation deleted')}
function clearAllData(){if(!confirm('This will permanently clear all staff, evaluations and drafts from this browser. Have you exported a backup?'))return;if(!confirm('Confirm again: clear ALL local evaluation data?'))return;state=migrateState({});selectedStaffId=null;activeEval=null;persist();renderAll();toast('Local data cleared')}
function download(name,text,type='text/plain;charset=utf-8'){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){const payload={...state,schemaVersion:SCHEMA_VERSION,exportedAt:new Date().toISOString(),app:'PHS Staff Progress Evaluation'};download(`PHS_staff_evaluation_backup_${today()}.json`,JSON.stringify(payload,null,2),'application/json;charset=utf-8');toast('Full backup downloaded')}
function csvCell(v){const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportSummaryCSV(){const headers=['Evaluation ID','Date','Staff','Department','Role','Type','Evaluator','Overall Arotake position','Assessed sections','Total sections','Completion %','Strengths / evidence','Next focus','Support / authority needed'],lines=[headers.map(csvCell).join(',')];[...state.evaluations].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{const s=staffById(e.staffId)||{},st=evaluationStats(e);lines.push([e.id,e.date,s.name||'',s.department||'',roleById(e.roleId).name,e.type||'',e.evaluator||'',stageLabel(st.overall),st.assessed,st.total,Math.round(st.completion*100),e.strengths||'',e.nextFocus||'',e.supportNeeded||''].map(csvCell).join(','))});download(`PHS_staff_evaluation_summary_${today()}.csv`,lines.join('\n'),'text/csv;charset=utf-8');toast('Summary CSV downloaded')}
function exportDetailedCSV(){const headers=['Evaluation ID','Date','Staff','Department','Role','Type','Evaluator','Responsibility section','Arotake position','Section note','Responsibility prompts'],lines=[headers.map(csvCell).join(',')];[...state.evaluations].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{const s=staffById(e.staffId)||{},role=roleById(e.roleId);role.sections.forEach((sec,si)=>lines.push([e.id,e.date,s.name||'',s.department||'',role.name,e.type||'',e.evaluator||'',`${sec.number}. ${sec.title}`,stageLabel(e.sectionRatings?.[si]),e.sectionNotes?.[si]||'',sec.items.join(' | ')].map(csvCell).join(',')))});download(`PHS_staff_evaluation_sections_${today()}.csv`,lines.join('\n'),'text/csv;charset=utf-8');toast('Section detail CSV downloaded')}
function importBackup(file){const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!Array.isArray(d.staff)||!Array.isArray(d.evaluations))throw new Error('Backup structure not recognised');if(!confirm(`Restore this backup containing ${d.staff.length} staff and ${d.evaluations.length} saved evaluations? This replaces the current browser data.`))return;state=migrateState(d);selectedStaffId=state.settings.selectedStaffId||state.staff[0]?.id||null;activeEval=null;persist();renderAll();toast('Backup restored')}catch(e){alert('Could not import this file: '+e.message)}finally{document.getElementById('importFile').value=''}};reader.readAsText(file)}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchView(t.dataset.view)));
document.getElementById('addStaffBtn').addEventListener('click',()=>openStaffModal());document.getElementById('staffSearch').addEventListener('input',renderStaffList);document.getElementById('cancelStaff').addEventListener('click',closeStaffModal);document.getElementById('saveStaff').addEventListener('click',saveStaffFromModal);document.getElementById('staffModal').addEventListener('click',e=>{if(e.target.id==='staffModal')closeStaffModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeStaffModal()});document.getElementById('importFile').addEventListener('change',e=>{if(e.target.files[0])importBackup(e.target.files[0])});
if(selectedStaffId){ensureActiveEval();openSectionIndex=firstUnassessedIndex(roleById(activeEval.roleId),activeEval);if(openSectionIndex<0)openSectionIndex=0}renderAll();
</script>
</body>
</html>
