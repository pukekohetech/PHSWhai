heir work for them.","Addresses significant performance, conduct or workload concerns through the correct process.","Builds leadership capability, succession and a respectful professional culture."]},{"number":4,"title":"School-wide Assurance","items":["Maintains appropriate oversight of teaching quality, curriculum, student achievement and pastoral systems within the portfolio.","Uses evidence to identify inequity, under-performance or systems needing improvement and checks that action follows.","Maintains oversight of significant health, safety, safeguarding and organisational risks and escalates serious concerns promptly.","Uses delegated budgets/resources responsibly and ensures required policies, records, privacy and compliance processes are followed.","Reviews outcomes and plans priorities, staffing and resources for the next cycle."]}]},{"id":"02","name":"Pou Taahuu / Faculty Leader","sourceFile":"02_Pou_Taahuu_Responsibilities_Discussion_List.docx","purpose":"Lead the whole faculty, develop HODs, create cross-department consistency and provide assurance to SLT.","oversight":"Allocated SLT line leader.","worksWith":"HODs, subject leaders, teachers, technicians/support staff, pastoral leaders and relevant school-wide portfolio holders.","escalation":"SLT for major staffing, serious complaints, significant risk, major capital decisions or issues that cannot be resolved at faculty level.","boundary":"The Pou Taahuu leads and assures the faculty; HODs retain day-to-day ownership of their departments.","sections":[{"number":1,"title":"Professional Practice","items":["Is punctual, reliable and ready for classes, duties and agreed commitments, and attends required meetings, briefings, PLD/training and school activities on time.","Communicates absences, delays, concerns and important information early and professionally.","Completes required administration, records and agreed actions accurately and on time.","Seeks feedback or support when needed, acts on it, and contributes positively to the professional culture of the school."]},{"number":2,"title":"Faculty Leadership and People","items":["Sets a clear faculty direction aligned with school priorities.","Develops and holds HODs accountable for the leadership of their departments without routinely taking over their work.","Coordinates issues that cross departments and clarifies who owns each responsibility.","Addresses significant staffing, workload or performance concerns at the appropriate level.","Represents faculty needs, risks and recommendations clearly to SLT."]},{"number":3,"title":"Curriculum, Teaching, Assessment and Achievement","items":["Maintains strategic oversight of curriculum progression, pathways and course coherence across the faculty.","Promotes high-quality teaching and coordinates faculty-wide PLD where common needs exist.","Ensures departments respond appropriately to curriculum, qualification, assessment and moderation requirements.","Monitors faculty-wide achievement, participation and equity patterns and requires action where needed.","Checks that agreed curriculum and teaching improvements are having a positive impact on learners."]},{"number":4,"title":"Safety, Resources and Planning","items":["Maintains faculty-wide assurance that specialist health and safety systems are operating in practice.","Allocates and monitors faculty budgets, equipment, staffing and technician/support resources within delegation.","Prioritises significant equipment, capital and replacement needs before escalation.","Reviews faculty performance and prepares clear priorities and resource needs for the following year."]}]},{"id":"03","name":"Head of Department","sourceFile":"03_Head_of_Department_Responsibilities_Discussion_List.docx","purpose":"Lead the day-to-day operation, curriculum, staff support, assessment, resources and safety of a subject/department.","oversight":"Pou Taahuu / Faculty Leader.","worksWith":"Department teachers, subject leaders/TICs, technicians, Pou Taahuu, Pou Tuarongo and relevant support staff.","escalation":"Pou Taahuu for significant staffing, unresolved complaints, major resource issues, serious risk or matters beyond department authority.","boundary":"The HOD owns the normal day-to-day running of the department and escalates significant or cross-faculty matters rather than passing routine work upward.","sections":[{"number":1,"title":"Professional Practice","items":["Is punctual, reliable and ready for classes, duties and agreed commitments, and attends required meetings, briefings, PLD/training and school activities on time.","Communicates absences, delays, concerns and important information early and professionally.","Completes required administration, records and agreed actions accurately and on time.","Seeks feedback or support when needed, acts on it, and contributes positively to the professional culture of the school."]},{"number":2,"title":"Department Leadership and Staff","items":["Provides clear day-to-day leadership and sets consistent expectations for the department.","Supports, develops and checks in with staff, including new and beginning teachers.","Delegates appropriate work, follows up agreed actions and addresses routine issues promptly.","Keeps the Pou Taahuu informed about significant staffing, workload, performance or department concerns."]},{"number":3,"title":"Teaching and Curriculum","items":["Promotes high-quality teaching within the department and discusses practice regularly with staff.","Shares effective strategies and resources and supports staff who are having difficulty with a class or programme.","Monitors whether programmes are working for students and encourages consistency without expecting identical teaching.","Leads curriculum planning, maintains clear progression and keeps programmes/course information current.","Reviews curriculum and teaching evidence to improve future programmes."]},{"number":4,"title":"Assessment and Achievement","items":["Ensures assessment, internal moderation and NZQA requirements are current, accurate and completed on time.","Monitors student achievement and identifies students or groups at risk.","Coordinates appropriate responses and checks whether interventions are improving outcomes."]},{"number":5,"title":"Safety, Resources and Department Operations","items":["Ensures department health and safety procedures, competency requirements and PPE are consistently followed.","Acts promptly on hazards, incidents, unsafe behaviour and faulty equipment and escalates serious risk immediately.","Manages department equipment, consumables, budget, maintenance and replacement needs responsibly.","Supports significant behaviour/whaanau matters, keeps essential documentation accessible, and plans ahead for the following year."]}]},{"id":"04","name":"Pou Tuarongo / Dean","sourceFile":"04_Pou_Tuarongo_Dean_Responsibilities_Discussion_List.docx","purpose":"Coordinate pastoral care and year-level systems so students receive timely, consistent support and clear expectations.","oversight":"Pastoral SLT / delegated senior leader.","worksWith":"Kaiaawhina, teachers, HODs/Pou Taahuu, attendance staff, counsellors, learning support, whaanau and external agencies where authorised.","escalation":"Pastoral SLT for safeguarding, serious wellbeing risk, major behaviour matters, statutory concerns, significant complaints or matters beyond delegated authority.","boundary":"The Pou Tuarongo coordinates pastoral response and escalation; classroom teaching and curriculum leadership remain with teachers and curriculum leaders.","sections":[{"number":1,"title":"Professional Practice","items":["Is punctual, reliable and ready for classes, duties and agreed commitments, and attends required meetings, briefings, PLD/training and school activities on time.","Communicates absences, delays, concerns and important information early and professionally.","Completes required administration, records and agreed actions accurately and on time.","Seeks feedback or support when needed, acts on it, and contributes positively to the professional culture of the school."]},{"number":2,"title":"Pastoral Leadership","items":["Provides clear, consistent year-level pastoral expectations and supports Kaiaawhina and teachers to apply them.","Responds to repeated, serious or complex student concerns that have been appropriately escalated.","Uses restorative and relationship-based approaches while maintaining clear boundaries and consequences.","Coordinates support for students with wellbeing, engagement or belonging concerns.","Escalates safeguarding, serious wellbeing or high-risk matters immediately through the correct process."]},{"number":3,"title":"Attendance, Behaviour and Wellbeing","items":["Monitors significant attendance patterns and coordinates timely follow-up.","Maintains oversight of repeated or serious behaviour concerns and agreed interventions.","Uses accurate records and evidence to monitor student needs and whether interventions are working.","Adjusts or escalates support when concerns persist or risk increases."]},{"number":4,"title":"Whaanau and Year-Level Coordination","items":["Communicates with whaanau professionally, promptly and positively, including when concerns become significant.","Keeps pastoral records factual, appropriately confidential and up to date and shares relevant information with the right staff.","Works effectively with curriculum leaders, support services and external agencies where authorised.","Coordinates key year-level routines, assemblies, information and events and reviews priorities for the next cycle."]}]},{"id":"05","name":"Subject Leader / TIC","sourceFile":"05_Subject_Leader_TIC_Responsibilities_Discussion_List.docx","purpose":"Coordinate a defined subject or course so teaching, assessment, resources and communication are consistent and ready.","oversight":"Head of Department.","worksWith":"Teachers of the course/subject, HOD, technicians/support staff and relevant curriculum/assessment contacts.","escalation":"HOD for staffing, curriculum, assessment, behaviour, safety or resource issues beyond routine subject coordination.","boundary":"The TIC coordinates the subject/course within delegated responsibility; the HOD retains overall department leadership and accountability.","sections":[{"number":1,"title":"Professional Practice","items":["Is punctual, reliable and ready for classes, duties and agreed commitments, and attends required meetings, briefings, PLD/training and school activities on time.","Communicates absences, delays, concerns and important information early and professionally.","Completes required administration, records and agreed actions accurately and on time.","Seeks feedback or support when needed, acts on it, and contributes positively to the professional culture of the school."]},{"number":2,"title":"Course and Curriculum Coordination","items":["Keeps the subject/course programme, sequence, resources and student information current and ready.","Ensures teachers understand what is being taught, when and to what expected standard.","Coordinates common planning and resources without requiring every teacher to teach identically.","Identifies curriculum gaps, duplication or changes needed and brings recommendations to the HOD.","Keeps course pathways, prerequisites and key information accurate."]},{"number":3,"title":"Teaching, Assessment and Achievement","items":["Supports teachers with subject-specific pedagogy, content knowledge and useful resources.","Coordinates assessment timelines, task information and internal moderation where applicable.","Ensures current standards and assessment materials are used accurately.","Monitors achievement patterns and students at risk within the course and coordinates responses with teachers/HOD.","Acts on moderation feedback, programme issues and identified inconsistencies."]},{"number":4,"title":"Communication and Resources","items":["Communicates important course decisions and changes promptly to staff.","Coordinates specialist resource, consumable or equipment needs and raises safety concerns promptly.","Keeps essential course documentation accessible and reviews improvements needed for the next year."]}]},{"id":"06","name":"Full-Time Teacher","sourceFile":"06_Full_Time_Teacher_Responsibilities_Discussion_List.docx","purpose":"Provide safe, inclusive and effective teaching for assigned classes and fulfil normal professional responsibilities as a member of staff.","oversight":"HOD / relevant curriculum leader, with pastoral and school-wide oversight through delegated leaders.","worksWith":"Students, whaanau, curriculum leaders, Pou Tuarongo/Kaiaawhina, learning support and colleagues.","escalation":"HOD for curriculum/teaching matters; Pou Tuarongo for significant pastoral matters; immediate escalation for serious safety or safeguarding concerns.","boundary":"The teacher owns day-to-day teaching, assessment, classroom routines and routine communication for assigned classes.","sections":[{"number":1,"title":"Professional Practice","items":["Is punctual, reliable and ready for classes, duties and agreed commitments, and attends required meetings, briefings, PLD/training and school activities on time.","Communicates absences, delays, concerns and important information early and professionally.","Completes required administration, records and agreed actions accurately and on time.","Seeks feedback or support when needed, acts on it, and contributes positively to the professional culture of the school."]},{"number":2,"title":"Teaching and Learning","items":["Plans and teaches purposeful lessons with clear learning expectations and appropriate challenge.","Builds respectful, culturally responsive relationships and an inclusive learning environment.","Uses a range of strategies and adjusts teaching to learner needs and evidence.","Uses feedback, feedforward and student voice to support progress.","Reflects on teaching impact and makes practical improvements."]},{"number":3,"title":"Assessment and Student Progress","items":["Uses assessment information accurately and gives students timely, useful feedback.","Completes required assessment, moderation, reporting and data entry accurately and on time.","Knows which students are at risk of not progressing and takes appropriate classroom action.","Raises significant achievement concerns with the relevant curriculum leader."]},{"number":4,"title":"Behaviour, Safety and Whaanau","items":["Establishes consistent routines and manages routine classroom behaviour using school procedures.","Records and escalates repeated, serious, safeguarding or wellbeing concerns appropriately.","Communicates professionally and positively with whaanau when required and works with pastoral/support staff when needed.","Follows health and safety requirements and ensures students use specialist spaces/equipment safely where applicable."]}]},{"id":"07","name":"PCT / Beginning Teacher — Year 1","sourceFile":"07_PCT_Beginning_Teacher_Year_1_Responsibilities_Discussion_List.docx","purpose":"Develop effective, safe classroom practice while participating fully in the school induction and mentoring programme.","oversight":"HOD / curriculum leader for day-to-day teaching, with mentor and professional leader support for induction and certification.","worksWith":"Mentor, HOD/TIC, colleagues, students, whaanau and pastoral/support staff.","escalation":"Seek support early from mentor/HOD; escalate serious safety, safeguarding, behaviour or employment matters through the relevant leader.","boundary":"A Year 1 PCT owns assigned classes but is expected to seek support earlier and use the structured induction and mentoring available.","sections":[{"number":1,"title":"Professional Practice","items":["Is punctual, reliable and ready for classes, duties and agreed commitments, and attends required meetings, briefings, PLD/training and school activities on time.","Communicates absences, delays, concerns and important information early and professionally.","Completes required administration, records and agreed actions accurately and on time.","Seeks feedback or support when needed, acts on it, and contributes positively to the professional culture of the school."]},{"number":2,"title":"Teaching and Learning","items":["Plans and teaches clear, purposeful lessons suited to the learners and curriculum.","Builds respectful, culturally responsive relationships and predictable classroom routines.","Uses feedback from observation, mentor/HOD conversations and student evidence to improve practice.","Adapts teaching when students are not learning as intended.","Develops confidence with subject knowledge, pedagogy and school systems."]},{"number":3,"title":"Students, Assessment and Administration","items":["Manages routine classroom behaviour using agreed school processes and seeks support before issues become entrenched.","Notices students who are struggling academically or pastorally and refers concerns appropriately.","Uses assessment, moderation and reporting processes accurately, seeking guidance when unsure.","Completes rolls, records, deadlines, safeguarding and health/safety responsibilities reliably."]},{"number":4,"title":"Induction and Professional Growth","items":["Meets regularly with the mentor and comes prepared to discuss evidence, questions and next steps.","Participates actively in the school PCT/induction programme and required PLD.","Acts on agreed development goals and can explain what has changed in practice.","Seeks help early when workload, confidence, classroom management or professional responsibilities are becoming difficult."]}]},{"id":"08","name":"PCT / Beginning Teacher — Year 2","sourceFile":"08_PCT_Beginning_Teacher_Year_2_Responsibilities_Discussion_List.docx","purpose":"Consolidate effective teaching and demonstrate increasing independence while continuing induction, mentoring and evidence-based professional growth.","oversight":"HOD / curriculum leader for day-to-day teaching, with mentor and professional leader support for induction and certification.","worksWith":"Mentor, HOD/TIC, colleagues, students, whaanau and pastoral/support staff.","escalation":"Seek support from mentor/HOD for developing issues; escalate serious safety, safeguarding, behaviour or employment matters through the relevant leader.","boundary":"A Year 2 PCT should show increasing independence while continuing to use mentoring and professional support appropriately.","sections":[{"number":1,"title":"Professional Practice","items":["Is punctual, reliable and ready for classes, duties and agreed commitments, and attends required meetings, briefings, PLD/training and school activities on time.","Communicates absences, delays, concerns and important information early and professionally.","Completes required administration, records and agreed actions accurately and on time.","Seeks feedback or support when needed, acts on it, and contributes positively to the professional culture of the school."]},{"number":2,"title":"Teaching and Learning","items":["Plans coherent learning and teaches with clear purpose, challenge and responsiveness to learner needs.","Builds strong, culturally responsive relationships and consistent learning routines.","Uses evidence, feedback and reflection to refine teaching rather than repeating ineffective approaches.","Demonstrates growing confidence and independence in subject pedagogy and classroom decision-making.","Contributes useful ideas and resources to colleagues as confidence develops."]},{"number":3,"title":"Assessment, Students and Collaboration","items":["Manages assessment, moderation, reporting and data responsibilities accurately and increasingly independently.","Uses achievement evidence to identify students at risk and adapt teaching or seek support.","Manages routine behaviour confidently and escalates repeated, serious, safeguarding or safety concerns appropriately.","Communicates professionally with whaanau and contributes reliably to department/faculty responsibilities."]},{"number":4,"title":"Professional Growth and Independence","items":["Uses mentor meetings purposefully and brings evidence of progress, questions and next steps.","Participates actively in required PCT/PLD activities and seeks further learning where a need is identified.","Can explain strengths, development priorities and the impact of changes made to practice.","Shows readiness for greater professional independence while still seeking support appropriately."]}]},{"id":"09","name":"PCT Mentor","sourceFile":"09_PCT_Mentor_Responsibilities_Discussion_List.docx","purpose":"Provide structured, evidence-informed mentoring that helps a beginning teacher grow in confidence, capability and professional responsibility.","oversight":"Professional leader / delegated PCT coordinator, working with the PCT’s HOD.","worksWith":"PCT, HOD/TIC, PCT coordinator/professional leader and relevant support staff.","escalation":"Professional leader/PCT coordinator for significant concerns about progress, wellbeing, conduct, safety or certification readiness.","boundary":"The mentor supports growth and evidence gathering; formal employment management and certification decisions remain with the delegated professional leader/employer processes.","sections":[{"number":1,"title":"Professional Practice","items":["Is punctual, reliable and ready for classes, duties and agreed commitments, and attends required meetings, briefings, PLD/training and school activities on time.","Communicates absences, delays, concerns and important information early and professionally.","Completes required administration, records and agreed actions accurately and on time.","Seeks feedback or support when needed, acts on it, and contributes positively to the professional culture of the school."]},{"number":2,"title":"Mentoring Relationship","items":["Meets the PCT regularly, reliably and with a clear professional focus.","Creates a trusting relationship where challenges can be discussed honestly without avoiding accountability.","Helps the PCT identify a small number of meaningful development goals.","Balances support with increasing independence rather than becoming the PCT’s problem-solver.","Understands the boundary between mentoring, line management and formal certification decisions."]},{"number":3,"title":"Observation, Feedback and Progress","items":["Observes practice often enough to provide useful evidence-based feedback.","Gives specific, practical feedback/feedforward linked to student learning and professional expectations.","Checks whether agreed actions have been tried and what impact they had.","Supports manageable evidence gathering and raises significant progress concerns early with the appropriate leader."]},{"number":4,"title":"Coordination and Records","items":["Coordinates with the HOD/PCT coordinator so advice is consistent and responsibilities are clear.","Protects appropriate confidentiality while sharing information that must be escalated.","Keeps brief, accurate mentoring records and agreed next steps."]}]},{"id":"10","name":"Kaiaawhina / Homeroom Teacher","sourceFile":"10_Kaiaawhina_Homeroom_Teacher_Responsibilities_Discussion_List.docx","purpose":"Provide consistent daily connection, accurate attendance information and early pastoral support for a homeroom group.","oversight":"Pou Tuarongo / Dean and relevant pastoral systems.","worksWith":"Students, Pou Tuarongo, teachers, whaanau and support staff.","escalation":"Pou Tuarongo for repeated attendance, behaviour, wellbeing or whaanau concerns; urgent safeguarding concerns immediately through school procedures.","boundary":"The Kaiaawhina notices, records, supports and refers; they are not expected to independently manage complex pastoral cases.","sections":[{"number":1,"title":"Professional Practice","items":["Is punctual, reliable and ready for classes, duties and agreed commitments, and attends required meetings, briefings, PLD/training and school activities on time.","Communicates absences, delays, concerns and important information early and professionally.","Completes required administration, records and agreed actions accurately and on time.","Seeks feedback or support when needed, acts on it, and contributes positively to the professional culture of the school."]},{"number":2,"title":"Daily Connection and Attendance","items":["Creates a calm, respectful and predictable homeroom routine and knows the students in the group.","Marks required rolls accurately and on time.","Notices meaningful attendance, engagement or wellbeing changes and follows the agreed referral process.","Provides key notices and year-level information accurately."]},{"number":3,"title":"Pastoral Support and Referral","items":["Listens appropriately to routine student concerns and distinguishes between support, referral and urgent risk.","Keeps brief, factual records or referrals where required.","Shares relevant information early with the Pou Tuarongo and follows through on agreed actions.","Communicates positively and professionally with whaanau when this sits within the role."]},{"number":4,"title":"Year-Level and Emergency Responsibilities","items":["Supports assemblies, year-level routines, events and expectations consistently.","Knows and follows evacuation, lockdown and student-accounting procedures for the homeroom role.","Does not carry serious pastoral or safeguarding concerns alone."]}]},{"id":"11","name":"Technician / Specialist Support Staff","sourceFile":"11_Technician_Support_Staff_Responsibilities_Discussion_List.docx","purpose":"Provide safe, timely technical and resource support that enables teaching programmes to operate effectively.","oversight":"HOD or designated support-staff line manager, with Pou Taahuu/operations oversight as locally delegated.","worksWith":"Teachers, HOD, Pou Taahuu, property/maintenance staff, suppliers and H&S personnel.","escalation":"HOD/line manager for workload, safety, stock, equipment or role-boundary concerns; urgent hazards immediately through H&S procedures.","boundary":"Technicians support teaching and specialist operations; teachers retain curriculum, assessment, student supervision and classroom behaviour responsibilities unless separately authorised.","sections":[{"number":1,"title":"Professional Practice","items":["Is punctual, reliable and ready for classes, duties and agreed commitments, and attends required meetings, briefings, PLD/training and school activities on time.","Communicates absences, delays, concerns and important information early and professionally.","Completes required administration, records and agreed actions accurately and on time.","Seeks feedback or support when needed, acts on it, and contributes positively to the professional culture of the school."]},{"number":2,"title":"Preparation and Staff Support","items":["Prepares agreed materials, equipment and spaces in time for practical learning.","Uses clear planning/prioritisation systems and communicates early when requests cannot be completed safely or on time.","Provides useful technical advice and helps staff understand specialist systems and constraints.","Maintains professional boundaries around what is and is not a technician responsibility."]},{"number":3,"title":"Health, Safety and Equipment","items":["Follows safe systems of work, PPE and hazardous-substance requirements.","Carries out checks and maintenance only within competency and delegated authority.","Identifies, isolates and reports unsafe equipment, hazards, incidents and near misses promptly.","Keeps required maintenance/service information and specialist spaces ready for safe use."]},{"number":4,"title":"Stock, Records and Workload","items":["Monitors stock, consumables and likely programme demand and stores materials correctly.","Keeps key supplier, maintenance and technical records accessible to the team.","Raises recurring workload pressure and future resource needs early and uses agreed priorities."]}]},{"id":"12","name":"Property / Maintenance Staff","sourceFile":"12_Property_Maintenance_Staff_Responsibilities_Discussion_List.docx","purpose":"Keep school property, grounds and building services safe, functional and appropriately maintained within delegated authority and competency.","oversight":"Property Manager / delegated operations leader, with SLT oversight for significant property and safety risk.","worksWith":"Property team, SLT, Pou Taahuu/HODs, technicians, office staff, contractors and other staff who report faults/hazards.","escalation":"Property Manager/SLT for major hazards, compliance matters, significant expenditure, contractor risk or work outside competency.","boundary":"Property/maintenance staff own building and grounds tasks within competence and delegation; teaching leaders retain curriculum and specialist-equipment instructional responsibilities.","sections":[{"number":1,"title":"Professional Practice","items":["Is punctual, reliable and ready for classes, duties and agreed commitments, and attends required meetings, briefings, PLD/training and school activities on time.","Communicates absences, delays, concerns and important information early and professionally.","Completes required administration, records and agreed actions accurately and on time.","Seeks feedback or support when needed, acts on it, and contributes positively to the professional culture of the school."]},{"number":2,"title":"Maintenance and Response","items":["Completes allocated repairs and routine maintenance to buildings, grounds and fixtures to an appropriate standard.","Prioritises work according to safety, operational impact and agreed plans.","Uses an agreed system to receive, record and update staff on maintenance requests.","Identifies recurring defects and refers work outside the property role or personal competency promptly."]},{"number":3,"title":"Health, Safety and Compliance","items":["Makes unsafe property areas secure where authorised and reports significant hazards immediately.","Uses safe work practices, PPE and isolation/lockout procedures and does not undertake restricted work without required competence.","Follows key, alarm, access, contractor and emergency procedures and protects security information.","Maintains required records for significant servicing, compliance, incidents and contractor work."]},{"number":4,"title":"Planning and Communication","items":["Maintains a forward plan for preventative maintenance, recurring servicing and assets nearing end of life.","Coordinates contractors and work to minimise disruption and communicates progress, delays, safety or cost concerns clearly.","Uses parts, tools and budgets responsibly and identifies significant future costs early."]}]}];

function uid(prefix='id'){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9)}
function cloneData(value){if(typeof structuredClone==='function')return structuredClone(value);return JSON.parse(JSON.stringify(value))}
function today(){return new Date().toISOString().slice(0,10)}
function safeText(value,max=LIMITS.text){return String(value??'').slice(0,max)}
function escapeHtml(value){return safeText(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function escapeAttr(value){return escapeHtml(value)}
function safeId(value,prefix='id'){const s=String(value??'').trim();return /^[A-Za-z0-9_.:-]{1,180}$/.test(s)?s:uid(prefix)}
function roleById(id){return ROLE_DEFS.find(r=>r.id===id)||ROLE_DEFS[0]}
function hasRole(id){return ROLE_DEFS.some(r=>r.id===id)}
function staffById(id){return state.staff.find(s=>s.id===id)}

function sectionFeedbackHtml(evaluation,role,sectionIndex){const data=sectionFeedbackData(evaluation,role,sectionIndex);if(!data.available)return `<div class="section-feedback compact" aria-live="polite"><span><b>Live section feedback</b> · score any item to begin.</span><span>${escapeHtml(data.headline)}</span></div>`;const hasDetails=data.strengths.length>0||data.priorities.length>0,hasCelebratedStrength=data.strengths.some(item=>item.includes('4 ·')||item.includes('5 ·'));return `<div class="section-feedback" aria-live="polite"><div class="section-feedback-head"><strong>Live section feedback · ${escapeHtml(data.headline)}</strong><span class="feedback-status">${data.complete?'Complete':'Provisional'}</span></div><p>${escapeHtml(data.summary)}</p>${distributionHtml(data.distribution)}${data.variation?`<div class="feedback-callout warn">${escapeHtml(data.variation)}</div>`:''}${hasDetails?`<div class="section-feedback-grid"><div class="section-feedback-box"><h4>${hasCelebratedStrength?'Strengths to celebrate':'Strongest current evidence'}</h4>${data.strengths.length?`<ul>${data.strengths.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`:'<div class="section-feedback-placeholder">No scored strength yet.</div>'}</div><div class="section-feedback-box"><h4>Suggested next step</h4>${data.priorities.length?`<ul>${data.priorities.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`:'<div class="section-feedback-placeholder">No priority identified yet.</div>'}</div></div>`:''}${data.support.length?`<div class="support-callout"><b>Support / authority to discuss:</b> ${escapeHtml(data.support.join(' '))}</div>`:''}${data.conversation?`<div class="feedback-callout"><b>Conversation prompt:</b> ${escapeHtml(data.conversation)}</div>`:''}</div>`}

function exportSummaryCSV(){const headers=['Evaluation ID','Date','Staff','Department','Role','Type','Evaluator','Overall average','Overall Arotake rank','Questions scored','Total questions','Sections complete','Total sections','Generated feedback summary','Strongest responsibility sections','Priority responsibility sections','Strongest item evidence','Suggested item actions','Support / authority prompts','Conversation prompt','Strengths / evidence','Next focus','Support / authority needed'],lines=[headers.map(csvCell).join(',')];[...state.evaluations].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{const staff=staffById(e.staffId)||{},role=roleById(e.roleId),stats=evaluationStats(e),rank=stageByMean(stats.mean),feedback=overallFeedbackData(e,role);lines.push([e.id,e.date,staff.name||'',staff.department||'',role.name,e.type||'',e.evaluator||'',stats.mean==null?'':stats.mean.toFixed(2),rank?`${rank.label} ${rank.emoji}`:'',stats.answeredItems,stats.totalItems,stats.completedSections,stats.totalSections,feedback.summary,feedback.sectionStrengths.join(' | '),feedback.sectionPriorities.join(' | '),feedback.strengths.join(' | '),feedback.priorities.join(' | '),feedback.support.join(' | '),feedback.conversation,e.strengths||'',e.nextFocus||'',e.supportNeeded||''].map(csvCell).join(','))});if(download(`PHS_staff_evaluation_summary_${today()}.csv`,'\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8'))toast('Summary CSV downloaded')}
function exportDetailedCSV(){const headers=['Evaluation ID','Date','Staff','Department','Role','Type','Evaluator','Responsibility section','Section average','Section Arotake rank','Responsibility item','Item score','Item Arotake rank','Suggested next step','Section note'],lines=[headers.map(csvCell).join(',')];[...state.evaluations].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{const staff=staffById(e.staffId)||{},role=roleById(e.roleId);role.sections.forEach((section,sectionIndex)=>{const stats=sectionStats(e,role,sectionIndex),rank=stageByMean(stats.mean);section.items.forEach((item,itemIndex)=>{const raw=e.ratings?.[questionKey(role.id,sectionIndex,itemIndex)],itemRank=stageByValue(raw);lines.push([e.id,e.date,staff.name||'',staff.department||'',role.name,e.type||'',e.evaluator||'',`${section.number}. ${section.title}`,stats.mean==null?'':stats.mean.toFixed(2),rank?`${rank.label} ${rank.emoji}`:(stats.complete?'Not applicable':''),item,Number.isInteger(raw)?raw:(raw==='na'?'N/A':''),itemRank?`${itemRank.label} ${itemRank.emoji}`:(raw==='na'?'N/A':''),itemRank?actionForItem(item,itemRank.value):'',e.sectionNotes?.[sectionIndex]||''].map(csvCell).join(','))})})});if(download(`PHS_staff_evaluation_questions_${today()}.csv`,'\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8'))toast('Question detail CSV downloaded')}
function validateBackupFile(file){if(!file)throw new Error('No file selected.');if(file.size>LIMITS.importBytes)throw new Error('The backup is too large for this browser tool.');if(file.type&&file.type!=='application/json'&&!file.name.toLowerCase().endsWith('.json'))throw new Error('Choose a JSON backup file.');}
function importBackup(file){try{validateBackupFile(file)}catch(error){alert(error.message);document.getElementById('importFile').value='';return}const reader=new FileReader();reader.onerror=()=>{alert('The file could not be read.');document.getElementById('importFile').value=''};reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed||typeof parsed!=='object'||!Array.isArray(parsed.staff)||!Array.isArray(parsed.evaluations))throw new Error('Backup structure not recognised.');if(parsed.staff.length>LIMITS.staff||parsed.evaluations.length>LIMITS.evaluations)throw new Error('The backup contains more records than this browser tool safely supports.');if(!confirm(`Restore this backup containing ${parsed.staff.length} staff and ${parsed.evaluations.length} saved ${plural(parsed.evaluations.length,'evaluation')}? This replaces the current browser data.`))return;state=migrateState(parsed);selectedStaffId=state.settings.selectedStaffId||state.staff[0]?.id||null;activeEval=null;if(selectedStaffId)ensureActiveEvaluation();persist();renderAll();toast('Backup restored')}catch(error){alert('Could not import this file: '+(error?.message||error))}finally{document.getElementById('importFile').value=''}};reader.readAsText(file)}
async function copyText(text,downloadName='PHS_feedback.txt'){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);toast('Feedback copied');return}const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();const ok=document.execCommand&&document.execCommand('copy');area.remove();if(ok){toast('Feedback copied');return}throw new Error('Clipboard unavailable')}catch(_error){download(downloadName,text,'text/plain;charset=utf-8');toast('Clipboard unavailable — feedback downloaded instead',3500)}}

function useGeneratedFeedback(){if(!activeEval)return;const role=roleById(activeEval.roleId),data=overallFeedbackData(activeEval,role);if(!data.available){toast('Score some responsibilities first');return}if((activeEval.strengths||activeEval.nextFocus||activeEval.supportNeeded)&&!confirm('Replace the existing reflection text with the generated strengths, next focus and support prompts?'))return;const strengthLines=[...data.sectionStrengths,...data.strengths].slice(0,6),focusLines=[...data.sectionPriorities,...data.priorities,data.conversation?`Conversation prompt: ${data.conversation}`:''].filter(Boolean).slice(0,7);activeEval.strengths=strengthLines.map(x=>'• '+x).join('\n');activeEval.nextFocus=focusLines.map(x=>'• '+x).join('\n');activeEval.supportNeeded=data.support.map(x=>'• '+x).join('\n');saveDraftNow(false);renderEvaluate();const panel=document.getElementById('reflectionPanel');if(panel)panel.open=true;requestAnimationFrame(()=>document.getElementById('strengths')?.focus());toast('Reflection fields filled from scores')}

function handleActionClick(event){const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;
  if(action==='switch-view'){switchView(button.dataset.view);return}
  if(action==='add-staff'){openStaffModal();return}
  if(action==='cancel-staff'){closeStaffModal();return}
  if(action==='select-staff'){saveDraftNow(false);selectedStaffId=button.dataset.id;const staff=staffById(selectedStaffId),key=staff?draftKey(staff.id,staff.roleId):'';activeEval=key&&state.drafts[key]?cloneData(state.drafts[key]):null;if(staff&&!activeEval)ensureActiveEvaluation();if(activeEval){openSectionIndex=firstIncompleteSection(roleById(activeEval.roleId),activeEval);if(openSectionIndex<0)openSectionIndex=0}persist();renderStaffList();renderEvaluate();return}
  if(action==='edit-current-staff'){openStaffModal(selectedStaffId);return}
  if(action==='edit-staff'){openStaffModal(button.dataset.id);return}
  if(action==='delete-staff'){deleteStaff(button.dataset.id);return}
  if(action==='toggle-section'){const index=Number(button.dataset.section),scrollY=window.scrollY;openSectionIndex=openSectionIndex===index?-1:index;pendingFocus={type:'section',section:index,scrollY};renderEvaluate();return}
  if(action==='score-question'){
    if(!activeEval)return;const key=button.dataset.key,sectionIndex=Number(button.dataset.section),raw=button.dataset.value,value=raw==='na'?'na':Number(raw),scrollY=window.scrollY,role=roleById(activeEval.roleId),wasComplete=sectionStats(activeEval,role,sectionIndex).complete;if(activeEval.ratings[key]===value)delete activeEval.ratings[key];else activeEval.ratings[key]=value;delete activeEval.sectionRatings[sectionIndex];saveDraftNow(false);const stats=sectionStats(activeEval,role,sectionIndex),completedNow=!wasComplete&&stats.complete;
    if(state.settings.autoAdvance!==false&&completedNow){const nextQuestion=firstUnscoredQuestion(role,activeEval,sectionIndex+1);openSectionIndex=nextQuestion?.sectionIndex??-1;pendingFocus=nextQuestion?{type:'question',key:nextQuestion.key,scrollSection:nextQuestion.sectionIndex}:{scrollY};renderEvaluate();const result=stats.mean==null?'Not applicable':scoreStageDisplay(stats.mean);toast(!nextQuestion?`${role.sections[sectionIndex].title}: ${result}. All responsibility items are complete.`:`${role.sections[sectionIndex].title}: ${result}`,4200)}else{openSectionIndex=sectionIndex;pendingFocus={type:'score',key,value:raw,scrollY};renderEvaluate()}return;
  }
  if(action==='next-unscored'){if(!activeEval)return;const role=roleById(activeEval.roleId),start=button.dataset.section==null?Math.max(0,openSectionIndex):Number(button.dataset.section),next=firstUnscoredQuestion(role,activeEval,start);if(!next){toast('All responsibility items are scored or marked N/A');return}openSectionIndex=next.sectionIndex;pendingFocus={type:'question',key:next.key,scrollSection:next.sectionIndex};renderEvaluate();return}
  if(action==='toggle-note'){const index=Number(button.dataset.section),wrap=document.querySelector(`[data-note-wrap="${index}"]`);if(!wrap)return;wrap.classList.toggle('show');if(wrap.classList.contains('show')){pendingFocus={type:'note',section:index};applyPendingFocus()}return}
  if(action==='clear-section'){clearSection(Number(button.dataset.section));return}
  if(action==='copy-section-feedback'){const index=Number(button.dataset.section),role=roleById(activeEval.roleId);copyText(sectionFeedbackText(activeEval,role,index),`PHS_section_feedback_${today()}.txt`);return}
  if(action==='copy-overall-feedback'){copyText(overallFeedbackText(activeEval,staffById(activeEval.staffId),roleById(activeEval.roleId)),`PHS_staff_feedback_${today()}.txt`);return}
  if(action==='fill-reflection'){useGeneratedFeedback();return}
  if(action==='open-paper-current'||action==='paper-use-current'){useCurrentForPaper();return}
  if(action==='print-paper'){preparePaperPrint();return}
  if(action==='print-review-pack'){prepareReviewPackPrint();return}
  if(action==='new-evaluation'){startNewEvaluation();return}
  if(action==='copy-previous'){copyPrevious();return}
  if(action==='save-draft'){saveDraftNow(true);return}
  if(action==='save-evaluation'){saveEvaluation();return}
  if(action==='print'){prepareEvaluationPrint();return}
  if(action==='open-evaluation'){openEvaluation(button.dataset.id);return}
  if(action==='delete-evaluation'){deleteEvaluation(button.dataset.id);return}
  if(action==='export-json'){exportJSON();return}
  if(action==='import-json'){document.getElementById('importFile').click();return}
  if(action==='export-summary'){exportSummaryCSV();return}
  if(action==='export-detail'){exportDetailedCSV();return}
  if(action==='clear-all'){clearAllData();return}
}
function handleInput(event){const field=event.target.dataset.field;if(event.target.id==='staffSearch'){renderStaffList();return}if(field==='paper-evaluator'){paperSettings.evaluator=safeText(event.target.value,100);schedulePaperPreview();return}if(!activeEval)return;if(field==='evaluator'){activeEval.evaluator=safeText(event.target.value,100);scheduleDraftSave()}else if(field==='section-note'){activeEval.sectionNotes[Number(event.target.dataset.section)]=safeText(event.target.value);scheduleDraftSave()}else if(field==='strengths'){activeEval.strengths=safeText(event.target.value);scheduleDraftSave()}else if(field==='next-focus'){activeEval.nextFocus=safeText(event.target.value);scheduleDraftSave()}else if(field==='support-needed'){activeEval.supportNeeded=safeText(event.target.value);scheduleDraftSave()}}
function handleChange(event){const field=event.target.dataset.field;if(field==='paper-role'){paperSettings.roleId=event.target.value==='all'?'all':(hasRole(event.target.value)?event.target.value:'03');renderPaperPreview();return}else if(field==='paper-staff'){paperSettings.staffId=staffById(event.target.value)?event.target.value:'';const staff=staffById(paperSettings.staffId);if(staff&&paperSettings.roleId!=='all'){paperSettings.roleId=staff.roleId;const roleControl=document.getElementById('paperRole');if(roleControl)roleControl.value=paperSettings.roleId}renderPaperPreview();return}else if(field==='paper-type'){paperSettings.type=event.target.value;renderPaperPreview();return}else if(field==='paper-date'){paperSettings.date=validDate(event.target.value);renderPaperPreview();return}else if(field==='paper-layout'){paperSettings.layout=['auto','one','two'].includes(event.target.value)?event.target.value:'auto';renderPaperPreview();return}else if(field==='paper-overview'){paperSettings.includeOverview=event.target.checked;renderPaperPreview();return}else if(field==='paper-notes'){paperSettings.includeNotes=event.target.checked;renderPaperPreview();return}else if(field==='paper-reflection'){paperSettings.includeReflection=event.target.checked;renderPaperPreview();return}else if(field==='eval-role'){saveDraftNow(false);const staff=staffById(selectedStaffId),roleId=event.target.value,key=draftKey(staff.id,roleId);activeEval=state.drafts[key]?cloneData(state.drafts[key]):null;if(!activeEval)ensureActiveEvaluation(false,roleId);openSectionIndex=firstIncompleteSection(roleById(roleId),activeEval);if(openSectionIndex<0)openSectionIndex=0;renderEvaluate()}else if(field==='eval-type'){activeEval.type=event.target.value;saveDraftNow(false)}else if(field==='date'){activeEval.date=validDate(event.target.value);saveDraftNow(false)}else if(field==='auto-advance'){state.settings.autoAdvance=event.target.checked;persist()}else if(field==='history-staff'){historyFilters.staffId=event.target.value;renderHistoryTable()}else if(field==='history-role'){historyFilters.roleId=event.target.value;renderHistoryTable()}else if(event.target.id==='importFile'&&event.target.files[0])importBackup(event.target.files[0])}
function handleKeydown(event){
  const modal=document.getElementById('staffModal');if(!modal.hidden){if(event.key==='Escape'){event.preventDefault();closeStaffModal();return}if(event.key==='Tab'){const focusable=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled])')].filter(el=>!el.hidden&&el.offsetParent!==null);if(focusable.length){const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}return}}
  const tab=event.target.closest('.tab');if(tab&&(event.key==='ArrowRight'||event.key==='ArrowLeft'||event.key==='Home'||event.key==='End')){event.preventDefault();const tabs=[...document.querySelectorAll('.tab')],index=tabs.indexOf(tab);let next=index;if(event.key==='ArrowRight')next=(index+1)%tabs.length;if(event.key==='ArrowLeft')next=(index-1+tabs.length)%tabs.length;if(event.key==='Home')next=0;if(event.key==='End')next=tabs.length-1;tabs[next].focus();switchView(tabs[next].dataset.view);return}
  const scoreButton=event.target.closest('.q-btn');if(scoreButton){if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();const buttons=[...scoreButton.closest('.question-rating').querySelectorAll('.q-btn')],index=buttons.indexOf(scoreButton),next=event.key==='ArrowRight'?(index+1)%buttons.length:(index-1+buttons.length)%buttons.length;buttons[next].focus();return}const shortcut=/^[1-5]$/.test(event.key)?event.key:(event.key.toLowerCase()==='n'?'na':null);if(shortcut){event.preventDefault();scoreButton.closest('.question-rating').querySelector(`[data-value="${shortcut}"]`)?.click()}}
}

function initialise(){document.addEventListener('click',handleActionClick);document.addEventListener('input',handleInput);document.addEventListener('change',handleChange);document.addEventListener('keydown',handleKeydown);document.getElementById('staffForm').addEventListener('submit',event=>{event.preventDefault();saveStaffFromModal()});document.getElementById('staffModal').addEventListener('mousedown',event=>{if(event.target.id==='staffModal')closeStaffModal()});window.addEventListener('beforeunload',event=>{saveDraftNow(false);if(!storageOK&&hasEvaluationWork(activeEval)){event.preventDefault();event.returnValue=''}});window.addEventListener('beforeprint',()=>{if(!document.body.classList.contains('print-paper')&&!document.body.classList.contains('print-evaluation')){if(activeView==='paperView'){renderPaperPreview();document.body.classList.add('print-paper');activePrintMode='paper'}else{document.body.classList.add('print-evaluation');activePrintMode='evaluation'}}if(!document.body.classList.contains('print-paper'))document.querySelectorAll('#evaluateView details:not(.feedback-more)').forEach(detail=>{detail.dataset.wasOpen=detail.open?'1':'0';detail.open=true})});window.addEventListener('afterprint',()=>{document.querySelectorAll('#evaluateView details').forEach(detail=>{if(detail.dataset.wasOpen!=null){detail.open=detail.dataset.wasOpen==='1';delete detail.dataset.wasOpen}});clearPrintClasses()});
  if(selectedStaffId){ensureActiveEvaluation();openSectionIndex=firstIncompleteSection(roleById(activeEval.roleId),activeEval);if(openSectionIndex<0)openSectionIndex=0}
  document.querySelectorAll('.view').forEach(panel=>panel.hidden=true);switchView(activeView);renderStaffList();updateStorageMeter();if(storageReadError)toast(storageReadError,6500)
}
initialise();
})();
